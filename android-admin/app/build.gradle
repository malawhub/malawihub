plugins { id 'com.android.application' }

android {
    namespace 'mw.malawihub.admin'
    compileSdk 36

    defaultConfig {
        applicationId 'mw.malawihub.admin'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
            }
            storePassword storePasswordValue
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword storePasswordValue
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:144.7559.01'
}
