<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Opening Student Portal · MalawiHub</title>
</head>
<body>
<p style="font-family:Arial,sans-serif;padding:20px">Opening MalawiHub Student Portal…</p>
<script>
(function(){
 const p=new URLSearchParams(location.search);
 const code=(p.get('code')||p.get('class')||p.get('join_code')||sessionStorage.getItem('malawihub_class_code')||'').trim().toUpperCase();
 if(code){
  sessionStorage.setItem('malawihub_class_code',code);
  sessionStorage.setItem('malawihub_student_portal','1');
  location.replace('../online-class/login.html?code='+encodeURIComponent(code));
 }else{
  location.replace('./');
 }
})();
</script>
</body>
</html>
