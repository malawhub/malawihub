<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Student Portal</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:650px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 6px 24px #0001}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd3df;border-radius:10px;margin:7px 0}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#087f3f;color:#fff}.muted{color:#667085;line-height:1.5}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#f8fafc}.error{background:#fef2f2;color:#991b1b}.hidden{display:none}.join-card{margin-top:18px;padding-top:18px;border-top:1px solid #e4e7ec}</style></head><body><div class="wrap"><div class="card"><h1>🎓 MalawiHub Student Portal</h1><p class="muted">Private portal for registered Online Class students. This is separate from the Main MalawiHub and Business Hub.</p><p class="muted"><b>New student?</b> Contact the administrator first. Student accounts are created by the administrator.</p><div id="loginArea"><input id="email" class="input" type="email" placeholder="Student email" autocomplete="username"><input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password"><button id="login" class="btn primary">Log in</button></div><div id="joinArea" class="join-card hidden"><h2>Join a Class</h2><input id="code" class="input" placeholder="Class code (e.g. 0986)" autocomplete="off" maxlength="32" style="text-transform:uppercase"><button id="join" class="btn primary">Join as Student</button><button id="logout" class="btn">Log out</button></div><p id="msg" class="msg"></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id);function showLoggedIn(){$('loginArea').classList.add('hidden');$('joinArea').classList.remove('hidden');}$('login').onclick=async()=>{const m=$('msg');m.textContent='Signing in…';m.className='msg';try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('Enter your student email and password.');const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;const {data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(p?.role!=='student'){await supabaseClient.auth.signOut();throw Error('This account is not registered as a student.')}m.textContent='Login successful.';showLoggedIn();}catch(e){m.textContent=e.message||'Student login failed.';m.className='msg error'}};async function checkSession(){const {data}=await supabaseClient.auth.getSession();if(!data?.session)return;const {data:p}=await supabaseClient.from('profiles').select('role').eq('id',data.session.user.id).maybeSingle();if(p?.role==='student')showLoggedIn();else await supabaseClient.auth.signOut()}checkSession();$('join').onclick=async()=>{const m=$('msg'),btn=$('join');const code=$('code').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,32);if(!code){m.textContent='Enter the class code.';m.className='msg error';return}btn.disabled=true;btn.textContent='Joining…';m.textContent='Checking class…';m.className='msg';try{const {data:sessionData}=await supabaseClient.auth.getSession();if(!sessionData?.session)throw Error('Please log in first.');const {data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',sessionData.session.user.id).maybeSingle();if(pe)throw pe;if(p?.role!=='student')throw Error('This account is not registered as a student.');const {data,error}=await supabaseClient.rpc('join_online_class',{p_join_code:code});if(error)throw error;const cls=Array.isArray(data)?data[0]:data;if(!cls)throw Error('Class not found. Check the class code.');if(cls.status==='ended')throw Error('This class has ended.');sessionStorage.setItem('malawihub_class_code',code);location.href='./classroom.html'}catch(e){m.textContent=e.message||'Unable to join the class.';m.className='msg error';btn.disabled=false;btn.textContent='Join as Student'}};$('logout').onclick=async()=>{sessionStorage.removeItem('malawihub_class_code');await supabaseClient.auth.signOut();location.reload()};</script></body></html>
