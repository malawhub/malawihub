<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Opening Student Login · MalawiHub</title>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || params.get('class') || params.get('join_code') || '').trim().toUpperCase();
  if (code) {
    try { sessionStorage.setItem('malawihub_class_code', code); } catch (_) {}
    params.set('code', code);
    params.delete('class');
    params.delete('join_code');
  }
  const query = params.toString();
  location.replace('../online-class/login.html' + (query ? '?' + query : '') + location.hash);
})();
</script>
</head>
<body>
<p>Opening MalawiHub Student Login…</p>
<noscript><p><a href="../online-class/login.html">Continue to Student Login</a></p></noscript>
</body>
</html>
