<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Student Portal</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:650px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 6px 24px #0001}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd3df;border-radius:10px;margin:7px 0}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#087f3f;color:#fff}.muted{color:#667085;line-height:1.5}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#f8fafc}.error{background:#fef2f2;color:#991b1b}</style></head><body><div class="wrap"><div class="card"><h1>🎓 MalawiHub Student Portal</h1><p class="muted">Private portal for registered Online Class students. This is separate from the Main MalawiHub and Business Hub.</p><p class="muted"><b>New student?</b> Contact the administrator first. Student accounts are created by the administrator.</p><input id="email" class="input" type="email" placeholder="Student email" autocomplete="username"><input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password"><button id="login" class="btn primary">Log in</button><p id="msg" class="msg"></p><p><a href="../online-classes/">← Online Classes</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id);$('login').onclick=async()=>{const m=$('msg');m.textContent='Signing in…';m.className='msg';try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;const {data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(p?.role!=='student'){await supabaseClient.auth.signOut();throw Error('This account is not registered as a student.')}location.href='./classroom.html'}catch(e){m.textContent=e.message||'Student login failed.';m.className='msg error'}};</script></body></html>
