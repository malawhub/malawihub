<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MALZORA Business User Access</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;color:#152033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 20px #00000010}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccd5e0;box-sizing:border-box}button{background:#1266f1;color:#fff;border:0;font-weight:700}.hidden{display:none}.muted{color:#667085;font-size:14px}.error{color:#b42318;background:#fff1f3;border:1px solid #fecdd3;padding:12px;border-radius:10px}</style></head><body><div class="wrap"><h1>💼 MALZORA Business</h1><p class="muted">Business users sign in with the username and password provided by the administrator.</p><div id="auth" class="card"><h2>🔐 Business user sign in</h2><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signIn">Sign in</button><p id="authMsg" class="muted"></p></div><div id="denied" class="card hidden"><h2>Access denied</h2><div class="error">Administrator accounts cannot use the Business user link.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../js/supabase.js"></script><script>const client=window.supabaseClient,$=id=>document.getElementById(id);function msg(t){$('authMsg').textContent=t}async function route(){const{data:{user}}=await client.auth.getUser();if(!user)return;const{data:p}=await client.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role==='admin'){await client.auth.signOut();$('auth').classList.add('hidden');$('denied').classList.remove('hidden');return}const{data:m}=await client.from('business_members').select('role').eq('user_id',user.id).in('role',['employee','employer']).limit(1);if(m?.[0]?.role==='employer')return location.replace('../employer.html');if(m?.[0]?.role==='employee')return location.replace('../employee.html');await client.auth.signOut();msg('This account is not assigned to Business access. Contact the administrator.')}async function login(){const username=$('username').value.trim().toLowerCase(),password=$('password').value;if(!username||!password)return msg('Enter your username and password.');$('signIn').disabled=true;msg('Signing in…');const{data,error}=await client.functions.invoke('business-user-login',{body:{username,password}});if(error||data?.error){$('signIn').disabled=false;return msg(data?.error||error?.message||'Login failed.')}const{error:sessionError}=await client.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});if(sessionError){$('signIn').disabled=false;return msg(sessionError.message)}route()}$('signIn').onclick=login;route();</script></body></html>
