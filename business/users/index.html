<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Business User Access</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;color:#152033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 20px #00000010}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccd5e0;box-sizing:border-box}button{background:#1266f1;color:#fff;border:0;font-weight:700}.hidden{display:none}.muted{color:#667085;font-size:14px}.error{color:#b42318;background:#fff1f3;border:1px solid #fecdd3;padding:12px;border-radius:10px}a{color:#075e54;font-weight:700}</style></head><body><div class="wrap"><p><a href="../guide.html">📖 How to use Business Hub</a></p><h1>💼 MalawiHub Business</h1><p class="muted">Secure Business access for registered employees and employers.</p><div id="auth" class="card"><h2>🔐 Business user sign in</h2><input id="username" placeholder="Username" autocomplete="username"><input id="code" placeholder="Access code" autocomplete="one-time-code" autocapitalize="characters" maxlength="8"><button id="signIn">Sign in</button><p id="authMsg" class="muted"></p></div><div id="denied" class="card hidden"><h2>Access denied</h2><div class="error">This account is not assigned to Business access. Contact the administrator.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../js/supabase.js"></script><script>const client=window.supabaseClient,$=id=>document.getElementById(id);let businessRole=null;function msg(t){$('authMsg').textContent=t}async function route(role){if(role==='employer')return location.replace('../employer.html');if(role==='employee')return location.replace('../employee.html');await client.auth.signOut();$('auth').classList.add('hidden');$('denied').classList.remove('hidden')}async function login(){const username=$('username').value.trim().toLowerCase(),code=$('code').value.trim().toUpperCase();if(!username||!code)return msg('Enter your username and access code.');$('signIn').disabled=true;msg('Signing in…');const{data,error}=await client.functions.invoke('business-user-login',{body:{username,code}});if(error||data?.error){$('signIn').disabled=false;return msg(data?.error||error?.message||'Login failed.')}businessRole=data.role||null;const{error:sessionError}=await client.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});if(sessionError){$('signIn').disabled=false;return msg(sessionError.message)}return route(businessRole)}$('signIn').onclick=login;['username','code'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));</script></body></html>
