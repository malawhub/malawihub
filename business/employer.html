<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Business Employer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;color:#152033}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #00000010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.box{border:1px solid #dbe4e0;border-radius:12px;padding:12px;background:#fbfdfc}.muted{color:#667085;font-size:14px}.hidden{display:none}.msg{border-left:4px solid #1266f1;padding:10px;margin:7px 0;background:#f8fafc}.danger{background:#fff;color:#b42318;border:1px solid #fecdd3;padding:10px;border-radius:10px}.error{color:#b42318}</style></head><body><div class="wrap"><div id="login" class="card"><h1>🔐 Business Hub</h1><p class="muted">Sign in with your registered MalawiHub account.</p><input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;box-sizing:border-box"><input id="password" type="password" placeholder="Password" style="width:100%;padding:12px;box-sizing:border-box;margin-top:7px"><button id="signin" style="width:100%;padding:12px;margin-top:7px">Sign in</button><p id="authmsg"></p></div><main id="app" class="hidden"><div class="card"><h1>💼 Business oversight</h1><p class="muted">Authorized employer view. This dashboard is read-only. It shows only employees belonging to your business.</p><div id="business"></div></div><div class="card"><h2>👥 Employees</h2><div id="employees">Loading…</div></div><div class="card"><h2>💰 Wallet balances</h2><div id="balances" class="grid"></div></div><div class="card"><h2>🔔 Wallet messages</h2><div id="messages">Loading…</div></div><div class="card"><button id="signout" class="danger">Sign out</button></div></main></div><script>const client=window.supabaseClient,$=id=>document.getElementById(id);let workspaceId=null;async function load(){const{data:{user},error}=await client.auth.getUser();if(error||!user){$('login').classList.remove('hidden');return}const{data:p}=await client.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role==='admin'){location.href='../admin/';return}const{data:members,error:me}=await client.from('business_members').select('id,workspace_id,role,display_name').eq('user_id',user.id).eq('role','employer').limit(1);if(me||!members?.length){$('authmsg').textContent='Business employer access is not registered.';return}workspaceId=members[0].workspace_id;$('login').classList.add('hidden');$('app').classList.remove('hidden');const{data:w}=await client.from('business_workspaces').select('name').eq('id',workspaceId).single();$('business').textContent=w?.name||'Business';await refresh()}async function refresh(){const{data:emps,error:ee}=await client.from('business_members').select('id,display_name,role,created_at').eq('workspace_id',workspaceId).eq('role','employee').order('created_at',{ascending:true});if(ee){$('employees').innerHTML='<p class="error">'+ee.message+'</p>';return}$('employees').innerHTML=emps?.length?emps.map(e=>'<div class="box"><b>'+esc(e.display_name)+'</b><div class="muted">Registered '+new Date(e.created_at).toLocaleString()+'</div></div>').join(''):'No employees registered yet.';const{data:b,error:be}=await client.from('business_wallet_balances').select('member_id,provider,balance,currency,status,last_sync_at,last_error').eq('workspace_id',workspaceId);$('balances').innerHTML=be?'<p class="error">'+be.message+'</p>':(b?.length?b.map(x=>{const e=emps.find(m=>m.id===x.member_id);return '<div class="box"><b>'+esc(e?.display_name||'Employee')+'</b><br>'+esc(x.provider==='airtel_money'?'Airtel Money':'TNM Mpamba')+'<h3>'+esc(x.status==='connected'?(x.currency||'MWK')+' '+x.balance:'Pending connection')+'</h3><div class="muted">'+esc(x.last_sync_at?'Last sync: '+new Date(x.last_sync_at).toLocaleString():x.last_error||'Provider connection pending')+'</div></div>'}).join(''):'No wallet balance records yet.');const{data:m,error:me2}=await client.from('business_wallet_messages').select('member_id,provider,message,created_at').eq('workspace_id',workspaceId).order('created_at',{ascending:false}).limit(100);$('messages').innerHTML=me2?'<p class="error">'+me2.message+'</p>':(m?.length?m.map(x=>{const e=emps.find(a=>a.id===x.member_id);return '<div class="msg"><b>'+esc(e?.display_name||'Employee')+' — '+esc(x.provider==='airtel_money'?'Airtel Money':'TNM Mpamba')+'</b><br>'+esc(x.message)+'<div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>'}).join(''):'No wallet messages yet.')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('signin').onclick=async()=>{const{error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('authmsg').textContent=error.message;else load()};$('signout').onclick=async()=>{await client.auth.signOut();location.reload()};load();</script></body></html>
