<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Business Hub</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;color:#152033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 20px #00000010}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccd5e0;box-sizing:border-box}button{background:#1266f1;color:#fff;border:0;font-weight:700}.hidden{display:none}.muted{color:#667085;font-size:14px}.readonly{background:#eef6ff;border:1px solid #cfe3ff}.danger{background:#fff;color:#b42318;border:1px solid #fecdd3}</style></head><body><div class="wrap"><h1>💼 MalawiHub Business Hub</h1><p class="muted">One secure Business Hub link for registered employees and employers.</p><div id="auth" class="card"><h2>🔐 Sign in</h2><input id="email" type="email" placeholder="MalawiHub email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signIn">Sign in</button><p id="authMsg" class="muted"></p></div><div id="notRegistered" class="card hidden"><h2>Business access not registered</h2><p>Your MalawiHub account is not registered for Business Hub access.</p><div class="readonly">Business Hub registration is controlled by the MalawiHub administrator.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const client=window.supabaseClient;const $=id=>document.getElementById(id);function msg(t){$('authMsg').textContent=t}async function load(){const{data:{user},error}=await client.auth.getUser();if(error)return msg(error.message);if(!user){$('auth').classList.remove('hidden');return}$('auth').classList.add('hidden');const{data:p,error:pe}=await client.from('profiles').select('role').eq('id',user.id).maybeSingle();if(pe)return msg(pe.message);if(p?.role==='admin'){location.href='../admin/';return}const{data:members,error:me}=await client.from('business_members').select('role').eq('user_id',user.id).in('role',['employee','employer']).limit(1);if(me)return msg(me.message);if(!members?.length){$('notRegistered').classList.remove('hidden');return}if(members[0].role==='employer'){location.href='employer.html';return}location.href='employee.html'}$('signIn').onclick=async()=>{const{error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg(error.message);else load()};load();</script></body></html>
