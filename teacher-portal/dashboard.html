<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Teacher Dashboard</title><style>html,body{margin:0;height:100%;background:#f5f7fb}iframe{width:100%;height:100%;border:0}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js?v=teacher-only-20260924"></script></head><body><iframe id="teacherFrame" src="../online-class/teacher.html" title="MalawiHub Teacher Dashboard"></iframe><script>const teacherFrame=document.getElementById('teacherFrame');(async()=>{try{const r=await supabaseClient.auth.getUser();const u=r.data?.user;if(!u){location.replace('/teacher-portal/');return}const {data:p}=await supabaseClient.from('profiles').select('role').eq('id',u.id).maybeSingle();if(p?.role!=='teacher'){await supabaseClient.auth.signOut();location.replace('/teacher-portal/?error=teacher_only');return}}catch(e){location.replace('/teacher-portal/?error=teacher_only')}})();</script></body></html>
