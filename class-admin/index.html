<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Class Administration</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 6px 24px #0001}.btn{display:block;width:100%;box-sizing:border-box;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none}.primary{background:#087f3f;color:#fff}.muted{color:#667085;line-height:1.5}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#f8fafc}.error{background:#fef2f2;color:#991b1b}</style></head><body><div class="wrap"><div class="card"><h1>⚙️ MalawiHub Class Administration</h1><p class="muted">Private administration area for managing Online Class teachers and students. This portal is separate from the Main Hub, Student Portal, Teacher Portal and Business Hub.</p><p id="msg" class="msg">Checking administrator access…</p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>async function init(){const m=document.getElementById('msg');try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session){m.innerHTML='<a class="btn primary" href="../admin/login.html">Open Administrator Login</a>';return}const {data:u}=await supabaseClient.auth.getUser();const {data:p}=await supabaseClient.from('profiles').select('role').eq('id',u.user.id).maybeSingle();if(p?.role!=='admin'){await supabaseClient.auth.signOut();m.textContent='Administrator access is required.';return}location.href='../online-class/admin.html'}catch(e){m.textContent=e.message||'Unable to verify administrator access.'}}init();</script></body></html>
