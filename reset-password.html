<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub — Reset Password</title><link rel="stylesheet" href="/css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;margin-top:40px;box-shadow:0 6px 24px #0001}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd3df;border-radius:10px;margin:7px 0}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px;background:#087f3f;color:#fff}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#f8fafc}.error{background:#fef2f2;color:#991b1b}.success{background:#ecfdf3;color:#065f46}</style></head><body><main class="wrap"><section class="card"><h1>🔐 Create a new password</h1><p>Enter your new password below. Use at least 8 characters.</p><input id="password" class="input" type="password" placeholder="New password" autocomplete="new-password"><input id="confirm" class="input" type="password" placeholder="Confirm new password" autocomplete="new-password"><button id="save" class="btn">Save New Password</button><p id="msg" class="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/supabase.js"></script><script>const $=id=>document.getElementById(id);supabaseClient.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY')$('msg').textContent='Enter your new password.';if(event==='SIGNED_IN'&&location.hash.includes('access_token'))$('msg').textContent='Recovery link verified. Create your new password.';});$('save').onclick=async()=>{const p=$('password').value,c=$('confirm').value;if(p.length<8){$('msg').textContent='Password must be at least 8 characters.';$('msg').className='msg error';return}if(p!==c){$('msg').textContent='Passwords do not match.';$('msg').className='msg error';return}$('save').disabled=true;$('msg').textContent='Saving…';try{const {error}=await supabaseClient.auth.updateUser({password:p});if(error)throw error;$('msg').textContent='✅ Password changed successfully. You can now log in with the new password.';$('msg').className='msg success';setTimeout(()=>location.href='/online-class/landing.html',1800)}catch(e){$('msg').textContent=e.message||'Could not change password.';$('msg').className='msg error';$('save').disabled=false}}</script></body></html>
