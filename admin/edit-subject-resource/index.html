<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Subject Resource - MalawiHub</title>
<link rel="stylesheet" href="../../css/style.css">
<style>
body{background:#f5f7fb}.box{max-width:700px;margin:30px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001}
h1{margin-top:0}.field{margin-bottom:16px}label{display:block;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:8px;padding:11px 18px;cursor:pointer;font-weight:600}
.save{background:#0b7a4b;color:white}.back{background:#eee;margin-left:8px}.msg{margin-top:15px;padding:10px;border-radius:8px;display:none}
.current{background:#f1f5f9;padding:10px;border-radius:8px;margin-bottom:18px;word-break:break-all}
</style>
</head>
<body>
<div class="box">
<h1>Edit Subject Resource</h1>
<div id="loading">Loading resource...</div>

<form id="form" style="display:none">
<div class="field">
<label>Title</label>
<input id="title" required>
</div>

<div class="field">
<label>Subject</label>
<select id="subject" required>
<option value="Chemistry">Chemistry</option>
<option value="Mathematics">Mathematics</option>
<option value="Biology">Biology</option>
<option value="Education">Education</option>
</select>
</div>

<div class="field">
<label>Category</label>
<select id="category" required>
<option>Notes</option>
<option>Textbook</option>
<option>Study Guide</option>
<option>Lecture Materials</option>
<option>Revision Materials</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Year (optional)</label>
<input id="year" type="number" min="1900" max="2100">
</div>

<div class="field">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div class="current">
<strong>Current file:</strong>
<a id="currentFile" href="#" target="_blank">Open current PDF</a>
</div>

<div class="field">
<label>Replace PDF (optional)</label>
<input id="file" type="file" accept="application/pdf">
</div>

<button class="btn save" type="submit">Save Changes</button>
<a class="btn back" href="../subject-resources/index.html">Cancel</a>
<div id="msg" class="msg"></div>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<script>
let resource=null;

async function checkAuth(){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session) location.href="../login.html";
}
checkAuth();

const id=new URLSearchParams(location.search).get("id");
const form=document.getElementById("form");
const loading=document.getElementById("loading");
const msg=document.getElementById("msg");

function message(text,error=false){
 msg.textContent=text;
 msg.style.display="block";
 msg.style.background=error?"#fee":"#e9f8ef";
 msg.style.color=error?"#a00":"#075c32";
}

async function loadResource(){
 if(!id){
  loading.textContent="No resource ID was provided.";
  return;
 }

 const {data,error}=await supabaseClient
  .from("subject_resources")
  .select("*")
  .eq("id",id)
  .single();

 if(error||!data){
  loading.textContent="Resource could not be found.";
  return;
 }

 resource=data;

 document.getElementById("title").value=data.title||"";
 document.getElementById("subject").value=data.subject||"";
 document.getElementById("category").value=data.category||"";
 document.getElementById("year").value=data.year||"";
 document.getElementById("description").value=data.description||"";
 document.getElementById("currentFile").href=data.link;

 loading.style.display="none";
 form.style.display="block";
}
loadResource();

form.addEventListener("submit",async e=>{
 e.preventDefault();

 const file=document.getElementById("file").files[0];

 if(file){
  if(file.type!=="application/pdf")
   return message("Only PDF files are allowed.",true);

  if(file.size>20*1024*1024)
   return message("PDF must not exceed 20 MB.",true);
 }

 message("Saving changes...");

 let link=resource.link;
 let newPath=null;

 if(file){
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  newPath=`${document.getElementById("subject").value.toLowerCase()}-${Date.now()}-${safeName}`;

  const {error}=await supabaseClient.storage
   .from("subject-resources")
   .upload(newPath,file,{contentType:"application/pdf",upsert:false});

  if(error) return message("New PDF upload failed: "+error.message,true);

  const {data}=supabaseClient.storage
   .from("subject-resources")
   .getPublicUrl(newPath);

  link=data.publicUrl;
 }

 const {error:dbError}=await supabaseClient
  .from("subject_resources")
  .update({
   title:document.getElementById("title").value.trim(),
   subject:document.getElementById("subject").value,
   category:document.getElementById("category").value,
   year:document.getElementById("year").value?
     Number(document.getElementById("year").value):null,
   description:document.getElementById("description").value.trim()||null,
   link
  })
  .eq("id",id);

 if(dbError){
  if(newPath)
   await supabaseClient.storage.from("subject-resources").remove([newPath]);

  return message("Could not save changes: "+dbError.message,true);
 }

 if(file){
  const oldUrl=resource.link;
  const marker="/subject-resources/";
  const pos=oldUrl.indexOf(marker);

  if(pos!==-1){
   const oldPath=decodeURIComponent(oldUrl.substring(pos+marker.length));
   if(oldPath) await supabaseClient.storage.from("subject-resources").remove([oldPath]);
  }
 }

 message("Resource updated successfully.");
 resource.link=link;
 document.getElementById("currentFile").href=link;
 document.getElementById("file").value="";
});
</script>
</body>
</html>
