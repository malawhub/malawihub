<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Administrator Classroom</title><style>html,body{margin:0;width:100%;height:100%;background:#f5f7fb;font-family:Arial,sans-serif}#guard{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#17352b;padding:20px;box-sizing:border-box}.box{background:#fff;border-radius:18px;padding:28px;max-width:520px;box-shadow:0 8px 30px #0001}iframe{display:none;width:100%;height:100%;border:0}</style></head><body><div id="guard"><div class="box"><h2>🎓 MalawiHub Administrator Classroom</h2><p id="status">Verifying administrator access…</p></div></div><iframe id="room" allow="camera; microphone; display-capture; autoplay; fullscreen"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js?v=admin-classroom-20260920"></script><script>(async()=>{const status=document.getElementById('status');try{if(!window.supabaseClient)throw Error('Supabase client did not load. Please refresh the page.');const sessionResult=await Promise.race([supabaseClient.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Administrator session check timed out. Please refresh.')),10000))]);const user=sessionResult?.data?.session?.user;if(!user)throw Error('Please sign in as administrator first.');const profileResult=await Promise.race([supabaseClient.from('profiles').select('role').eq('id',user.id).maybeSingle(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Administrator profile check timed out. Please refresh.')),10000))]);if(profileResult.error)throw profileResult.error;if(profileResult.data?.role!=='admin')throw Error('Administrator access is required.');const code=new URLSearchParams(location.search).get('code');if(!code)throw Error('No class code was supplied.');const room=document.getElementById('room');room.onload=()=>{room.style.display='block';document.getElementById('guard').style.display='none'};room.src='../online-class/index.html?code='+encodeURIComponent(code)+'&mode=admin&admin=1&role=admin&v=admin-classroom-20260921#admin';setTimeout(()=>{if(room.style.display!=='block')status.textContent='Classroom is taking too long to load. Please refresh once.'},12000);}catch(e){console.error(e);status.textContent=e.message||'Administrator access could not be verified.';}})();</script></body></html>
