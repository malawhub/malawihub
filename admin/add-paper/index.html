<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Past Paper | MalawiHub</title>

    <link rel="stylesheet" href="../../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase.js"></script>
</head>

<body>

<header>
    <div class="logo">🇲🇼 MalawiHub</div>

    <nav>
        <a href="../index.html">Dashboard</a>
        <a href="../manage-papers/index.html">Manage Papers</a>
        <a href="../../papers/index.html">Public Papers</a>
    </nav>
</header>

<section class="hero">
    <h1>➕ Add Past Paper</h1>
    <p>Upload an examination paper to the MalawiHub library.</p>
</section>

<main class="tools-section">

    <section class="card">

        <label for="title">Paper Title</label>
        <input
            id="title"
            type="text"
            placeholder="e.g. MSCE Chemistry Paper 1"
        >

        <label for="category">Category</label>
        <input
            id="category"
            type="text"
            placeholder="e.g. MSCE"
        >

        <label for="subject">Subject</label>
        <input
            id="subject"
            type="text"
            placeholder="e.g. Chemistry"
        >

        <label for="year">Year</label>
        <input
            id="year"
            type="number"
            placeholder="e.g. 2024"
        >

        <label for="description">Description</label>
        <textarea
            id="description"
            placeholder="Short description of the paper"
        ></textarea>

        <label for="paperFile">PDF Paper</label>
        <input
            id="paperFile"
            type="file"
            accept="application/pdf,.pdf"
        >

        <p>
            <small>
                PDF only. Maximum recommended size: 50 MB.
            </small>
        </p>

        <button onclick="savePaper()">
            Upload & Save Past Paper
        </button>

        <p id="message"></p>

    </section>

</main>

<footer>
    <p>© 2026 MalawiHub</p>
    <p>Free study resources for students.</p>
</footer>

<script>

async function checkAdminAuth() {

    const { data: { session } } =
        await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "../login.html";
    }
}

checkAdminAuth();


async function savePaper() {

    const title =
        document.getElementById("title").value.trim();

    const category =
        document.getElementById("category").value.trim();

    const subject =
        document.getElementById("subject").value.trim();

    const year =
        Number(document.getElementById("year").value);

    const description =
        document.getElementById("description").value.trim();

    const fileInput =
        document.getElementById("paperFile");

    const file =
        fileInput.files[0];

    const message =
        document.getElementById("message");


    if (
        !title ||
        !category ||
        !subject ||
        !year ||
        !file
    ) {

        message.textContent =
            "Please complete all required fields and select a PDF.";

        return;
    }


    if (file.type !== "application/pdf") {

        message.textContent =
            "❌ Please select a PDF file.";

        return;
    }


    if (file.size > 20 * 1024 * 1024) {

        message.textContent =
            "❌ The PDF is too large. Please use a file smaller than 50 MB.";

        return;
    }


    message.textContent =
        "⏳ Uploading PDF...";


    const safeTitle =
        title
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 80);


    const fileName =
        `${Date.now()}-${safeTitle || "paper"}.pdf`;

    const filePath =
        `${year}/${fileName}`;


    const { error: uploadError } =
        await supabaseClient.storage
            .from("past-papers")
            .upload(filePath, file, {
                contentType: "application/pdf",
                upsert: false
            });


    if (uploadError) {

        console.error(
            "PDF upload failed:",
            uploadError
        );

        message.textContent =
            "❌ PDF upload failed. Please try again.";

        return;
    }


    const { data: publicUrlData } =
        supabaseClient.storage
            .from("past-papers")
            .getPublicUrl(filePath);


    const publicUrl =
        publicUrlData.publicUrl;


    const { error: databaseError } =
        await supabaseClient
            .from("past_papers")
            .insert([{
                title: title,
                category: category,
                subject: subject,
                year: year,
                description: description,
                link: publicUrl
            }]);


    if (databaseError) {

        console.error(
            "Database save failed:",
            databaseError
        );


        await supabaseClient.storage
            .from("past-papers")
            .remove([filePath]);


        message.textContent =
            "❌ Paper could not be saved. The uploaded file was removed.";

        return;
    }


    message.textContent =
        "✅ Past paper uploaded and saved successfully.";


    document.getElementById("title").value = "";
    document.getElementById("category").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("year").value = "";
    document.getElementById("description").value = "";
    fileInput.value = "";
}

</script>

</body>
</html>
