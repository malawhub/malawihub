<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalawiHub Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
* { box-sizing: border-box; }
body { 
    margin:0; 
    font-family: Arial, sans-serif; 
    background:#f5f7fb; 
    padding:20px;
}
.header {
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.header h1 { margin:0; color:#087f5b; }
.stats {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap:15px;
    margin-bottom:20px;
}
.stat-card {
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.stat-card h3 { margin:0 0 10px; color:#666; font-size:14px; }
.stat-card p { margin:0; font-size:32px; font-weight:800; color:#087f5b; }
.menu {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap:15px;
}
.menu a {
    display:block;
    background:white;
    padding:20px;
    border-radius:12px;
    text-decoration:none;
    color:#333;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    font-weight:600;
}
.menu a:hover { background:#087f5b; color:white; }
.loading {
    text-align:center;
    padding:50px;
    font-size:18px;
    color:#666;
}
</style>
</head>
<body>

<div id="loading" class="loading">Checking access...</div>

<div id="admin-content" style="display:none;">
    <div class="header">
        <h1>MalawiHub Admin</h1>
        <p id="admin-email"></p>
    </div>

    <div class="stats" id="stats">
        <div class="stat-card"><h3>Total Resources</h3><p id="total-resources">0</p></div>
        <div class="stat-card"><h3>Chemistry</h3><p id="chem-resources">0</p></div>
        <div class="stat-card"><h3>Mathematics</h3><p id="math-resources">0</p></div>
        <div class="stat-card"><h3>Past Papers</h3><p id="total-papers">0</p></div>
    </div>

    <div class="menu">
        <a href="/admin/add-resource/">+ Add Resource</a>
        <a href="/admin/manage-resources/">Manage Resources</a>
        <a href="/admin/add-paper/">+ Add Past Paper</a>
        <a href="/admin/manage-papers/">Manage Past Papers</a>
    </div>
</div>
