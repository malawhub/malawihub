<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MalawiHub Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(
            180deg,
            #eaf8f3 0%,
            #f5f7fb 42%,
            #ffffff 100%
        );
    color: #222;
}

.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.topbar {
    background: #087f5b;
    color: white;
    padding: 18px 20px;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.12);
}

.topbar-inner {
    max-width: 620px;
    margin: 0 auto;
}

.brand {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
}

.main {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: 28px 18px 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.profile-card {
    background: white;
    border-radius: 20px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    border: 1px solid #e7ece9;
}

.avatar {
    width: 78px;
    height: 78px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #087f5b;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    font-weight: 800;
}


.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.profile-card h1 {
    margin: 0;
    font-size: 24px;
    color: #17352b;
}

.role {
    margin: 8px 0 0;
    color: #087f5b;
    font-weight: 700;
    font-size: 15px;
}

.welcome {
    margin: 12px 0 0;
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
}

.manage-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 26px;
    padding: 16px 20px;
    border-radius: 13px;
    background: #087f5b;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 800;
    box-shadow: 0 6px 18px rgba(8, 127, 91, 0.25);
    transition: 0.2s ease;
}

.manage-btn:hover {
    background: #066b4d;
    transform: translateY(-1px);
}

.logout-area {
    margin-top: auto;
    padding-top: 35px;
}

.logout-btn {
    width: 100%;
    border: 1px solid #f0c5ca;
    background: white;
    color: #c92a3a;
    padding: 14px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
}

.logout-btn:hover {
    background: #fff5f5;
}

.footer {
    text-align: center;
    padding: 18px;
    color: #8a9290;
    font-size: 12px;
}

.loading {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #666;
}

.error-box {
    max-width: 500px;
    margin: 70px auto;
    background: white;
    padding: 28px 22px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
}

.error-box h2 {
    color: #c92a3a;
    margin-top: 0;
}

.error-box p {
    color: #666;
    line-height: 1.6;
}

.retry-btn {
    border: none;
    background: #087f5b;
    color: white;
    padding: 11px 20px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 700;
}

@media (max-width: 480px) {
    .topbar {
        padding: 16px;
    }

    .brand {
        font-size: 20px;
    }

    .main {
        padding: 22px 14px 14px;
    }

    .profile-card {
        padding: 25px 18px;
        border-radius: 18px;
    }



.profile-card h1 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div id="loading" class="loading">
    Checking admin access...
</div>

<div id="error" style="display:none;"></div>

<div id="admin-content" class="page" style="display:none;">

    <header class="topbar">
        <div class="topbar-inner">
            <h2 class="brand">🇲🇼 MalawiHub Admin</h2>
        </div>
    </header>

    <main class="main">

        <section class="user-stats-card" style="
            margin-top:18px;
            padding:20px;
            border-radius:16px;
            background:#ffffff;
            box-shadow:0 4px 18px rgba(0,0,0,.08);
        ">
            <h2 style="margin:0 0 16px;">👥 MalawiHub Users</h2>

            <div style="
                display:grid;
                grid-template-columns:repeat(2,1fr);
                gap:12px;
            ">
                <div style="
                    padding:16px;
                    border-radius:12px;
                    background:#f1f8f5;
                ">
                    <div style="font-size:13px;color:#666;">Registered Users</div>
                    <strong id="registeredUsers" style="font-size:28px;">—</strong>
                </div>

                <div style="
                    padding:16px;
                    border-radius:12px;
                    background:#eef7ff;
                ">
                    <div style="font-size:13px;color:#666;">Active Users</div>
                    <strong id="activeUsers" style="font-size:28px;">—</strong>
                </div>
            </div>

            <p id="userStatsStatus" style="
                margin:14px 0 0;
                font-size:13px;
                color:#666;
            ">Loading user statistics...</p>
        </section>

        <section class="profile-card">

            <div class="avatar">
                <img src="assets/admin-profile.png" alt="AMON ALICK ASSAM">
            </div>

            <h1>AMON ALICK ASSAM</h1>

            <p class="role">
                Administrator
            </p>

            <p class="welcome">
                Welcome to your MalawiHub administration area.
            </p>

            <a
                href="resource-management.html"
                class="manage-btn">
                📚 Manage Resources
            </a>

        </section>

        <div class="logout-area">

            <button
                type="button"
                class="logout-btn"
                id="logoutBtn">
                🚪 Logout
            </button>

        </div>

    </main>

    <div class="footer">
        MalawiHub Administration
    </div>

</div>

<script>

const ADMIN_UUID =
    "759a11e5-6166-4fc0-8979-352ba589e88f";


const loading =
    document.getElementById("loading");

const adminContent =
    document.getElementById("admin-content");

const errorBox =
    document.getElementById("error");


function showError(title, message) {

    loading.style.display = "none";

    adminContent.style.display = "none";

    errorBox.style.display = "block";

    errorBox.innerHTML = `
        <div class="error-box">
            <h2>${title}</h2>
            <p>${message}</p>

            <button
                type="button"
                class="retry-btn"
                onclick="location.reload()">
                Try Again
            </button>
        </div>
    `;
}


async function checkAdminAccess() {

    try {

        if (
            typeof supabaseClient ===
            "undefined"
        ) {

            showError(
                "Configuration Error",
                "Supabase could not be loaded."
            );

            return;
        }


        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            showError(
                "Authentication Error",
                "Unable to check your login session."
            );

            return;
        }


        const session =
            data?.session;


        if (
            !session ||
            !session.user
        ) {

            window.location.href =
                "login.html";

            return;
        }


        const user =
            session.user;


        if (
            user.id !== ADMIN_UUID
        ) {

            showError(
                "Access Denied",
                "Your account does not have administrator access."
            );

            return;
        }


        loading.style.display =
            "none";

        adminContent.style.display =
            "flex";

        // Load MalawiHub user statistics
        try {
            const {
                data: { session: currentSession }
            } = await supabaseClient.auth.getSession();

            if (!currentSession?.access_token) {
                throw new Error("Admin session JWT is missing.");
            }

            const {
                data: functionData,
                error: functionError
            } = await supabaseClient.functions.invoke(
                "admin-user-stats",
                {
                    headers: {
                        Authorization:
                            `Bearer ${currentSession.access_token}`
                    }
                }
            );

            if (functionError) throw functionError;

            document.getElementById("registeredUsers").textContent =
                functionData?.registeredUsers ?? "0";

            document.getElementById("activeUsers").textContent =
                functionData?.activeUsers ?? "0";

            document.getElementById("userStatsStatus").textContent =
                "Updated just now";

        } catch (statsError) {
            console.error(
                "User statistics error:",
                statsError
            );

            document.getElementById("registeredUsers").textContent = "—";
            document.getElementById("activeUsers").textContent = "—";
            document.getElementById("userStatsStatus").textContent =
                "Unable to load user statistics";
        }


    } catch (error) {

        console.error(
            "Admin error:",
            error
        );

        showError(
            "Something went wrong",
            "Unable to load the administrator page."
        );
    }
}


document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async function () {

            try {

                const {
                    error
                } =
                    await supabaseClient.auth.signOut();


                if (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                    alert(
                        "Unable to log out. Please try again."
                    );

                    return;
                }


                window.location.href =
                    "login.html";


            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

                alert(
                    "Unable to log out. Please try again."
                );
            }

        }
    );


if (
    typeof supabaseClient !==
    "undefined"
) {

    supabaseClient.auth.onAuthStateChange(
        function(event) {

            if (
                event ===
                "SIGNED_OUT"
            ) {

                window.location.href =
                    "login.html";
            }

        }
    );

}


checkAdminAccess();

</script>

</body>
</html>
