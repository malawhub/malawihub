services:
  malawihub-ai:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN
    command:
      - --model
      - Qwen/Qwen3-8B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${AI_ENGINE_API_KEY}
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.90"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
