name: Build MalawiHub Smart Keyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-keyboard/**'
      - '.github/workflows/build-keyboard-apk.yml'
  pull_request:
    paths:
      - 'android-keyboard/**'
      - '.github/workflows/build-keyboard-apk.yml'

jobs:
  build-keyboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Smart Keyboard APK
        working-directory: android-keyboard
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp android-keyboard/app/build/outputs/apk/debug/app-debug.apk malawihub-smart-keyboard.apk
      - name: Upload Smart Keyboard APK
        uses: actions/upload-artifact@v4
        with:
          name: malawihub-smart-keyboard
          path: malawihub-smart-keyboard.apk
          if-no-files-found: error
