name: Deploy Business Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/admin-create-business-user/**"
      - "supabase/functions/admin-delete-business-user/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-business-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Business user registration
        run: supabase functions deploy admin-create-business-user --project-ref cdqrdovgdidzxmyygoee
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Business user unregister
        run: supabase functions deploy admin-delete-business-user --project-ref cdqrdovgdidzxmyygoee
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
