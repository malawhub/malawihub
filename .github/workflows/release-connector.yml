name: Release MalawiHub Business Connector

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-connector.yml'
      - 'android-connector/**'

permissions:
  contents: write

jobs:
  release-connector:
    name: Build and publish signed connector APK and AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/malawihub-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets and restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH" || { echo "Keystore restoration produced an empty file"; exit 1; }
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Signing keystore and alias verified."

      - name: Verify private-key password
        shell: bash
        run: |
          set -euo pipefail
          rm -f signing-test.csr
          keytool -certreq \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file signing-test.csr >/dev/null
          test -s signing-test.csr || { echo "Private-key password verification did not produce a CSR"; exit 1; }
          rm -f signing-test.csr
          echo "Private-key password verified."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          echo "Android SDK 36 and apksigner are ready."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle project
        working-directory: android-connector
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          gradle --version

      - name: Build signed release APK and Google Play AAB
        working-directory: android-connector
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed APK and AAB and create checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="android-connector/app/build/outputs/apk/release/app-release.apk"
          AAB="android-connector/app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK" || { echo "Release APK was not produced"; exit 1; }
          test -s "$AAB" || { echo "Release AAB was not produced"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee android-connector/app-release.apk.sha256
          sha256sum "$AAB" | tee android-connector/app-release.aab.sha256
          ls -lh "$APK" "$AAB" android-connector/app-release.apk.sha256 android-connector/app-release.aab.sha256

      - name: Upload verified APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: malawihub-business-connector-v1.0.2
          path: |
            android-connector/app/build/outputs/apk/release/app-release.apk
            android-connector/app/build/outputs/bundle/release/app-release.aab
            android-connector/app-release.apk.sha256
            android-connector/app-release.aab.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="business-connector-v1.0.2"
          APK="android-connector/app/build/outputs/apk/release/app-release.apk"
          AAB="android-connector/app/build/outputs/bundle/release/app-release.aab"
          APK_SHA="android-connector/app-release.apk.sha256"
          AAB_SHA="android-connector/app-release.aab.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its release assets."
            gh release upload "$TAG" "$APK" "$AAB" "$APK_SHA" "$AAB_SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" "$APK_SHA" "$AAB_SHA" \
              --title "MalawiHub Business Connector v1.0.2" \
              --notes "Production signed MalawiHub Business Connector v1.0.2. This release includes the Android App Bundle (AAB) prepared for Google Play submission and the APK for direct distribution. Core functionality reads supported business transaction SMS for business wallet monitoring and requires the applicable Google Play SMS permission declaration and review." \
              --target main
          fi
          echo "GitHub Release publication completed."
