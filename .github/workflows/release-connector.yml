name: Release MalawiHub Business Connector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-connector:
    name: Build and publish signed connector APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/malawihub-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: android-connector
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and checksum APK
        run: |
          APK="android-connector/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          sha256sum "$APK" | tee android-connector/app-release.sha256
          ls -lh "$APK"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="business-connector-v1.0.0"
          gh release create "$TAG" \
            android-connector/app/build/outputs/apk/release/app-release.apk \
            android-connector/app-release.sha256 \
            --title "MalawiHub Business Connector v1.0.0" \
            --notes "Official signed MalawiHub Business Connector v1.0.0. Use this APK to connect a supported business phone to MalawiHub Business Hub." \
            --target main
