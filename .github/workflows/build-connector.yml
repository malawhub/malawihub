name: Build MalawiHub Business Connector

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-connector/**'
      - '.github/workflows/build-connector.yml'

permissions:
  contents: read

jobs:
  build-connector:
    name: Build connector APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-connector
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s android-connector/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-connector/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload connector APK
        uses: actions/upload-artifact@v4
        with:
          name: malawihub-business-connector-apk
          path: android-connector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
