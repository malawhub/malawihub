name: Build teacher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-teacher/**'
      - '.github/workflows/build-teacher-apk.yml'
  pull_request:
    paths:
      - 'android-teacher/**'
      - '.github/workflows/build-teacher-apk.yml'

jobs:
  build-teacher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android-teacher
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK to teacher.apk
        run: cp android-teacher/app/build/outputs/apk/debug/app-debug.apk teacher.apk
      - name: Upload teacher APK
        uses: actions/upload-artifact@v4
        with:
          name: teacher-apk
          path: teacher.apk
          if-no-files-found: error

# Keep this workflow active for the current production APK pipeline.
