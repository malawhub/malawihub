name: Build teacher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-teacher/**'
      - '.github/workflows/build-teacher-apk.yml'
  pull_request:
    paths:
      - 'android-teacher/**'
      - '.github/workflows/build-teacher-apk.yml'

jobs:
  build-teacher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android-teacher
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK to teacher.apk
        run: cp android-teacher/app/build/outputs/apk/debug/app-debug.apk teacher.apk
      - name: Upload teacher APK
        uses: actions/upload-artifact@v4
        with:
          name: teacher-apk
          path: teacher.apk
          if-no-files-found: error


  publish:
    needs: build-teacher
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: teacher-apk
          path: .
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: malawihub-teacher-v1.0.0
          name: MalawiHub Teacher Portal v1.0.0
          body: MalawiHub Teacher Portal v1.0.0 — installable Android APK for the Online Class teacher portal.
          files: teacher.apk
          make_latest: false
          prerelease: false
