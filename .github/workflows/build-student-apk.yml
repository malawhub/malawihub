name: Build student APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-student/**'
      - '.github/workflows/build-student-apk.yml'
  pull_request:
    paths:
      - 'android-student/**'
      - '.github/workflows/build-student-apk.yml'

jobs:
  build-student:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android-student
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK to student.apk
        run: cp android-student/app/build/outputs/apk/debug/app-debug.apk student.apk
      - name: Upload student APK
        uses: actions/upload-artifact@v4
        with:
          name: student-apk
          path: student.apk
          if-no-files-found: error

# Keep this workflow active for the current production APK pipeline.
