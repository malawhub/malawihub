name: Build student APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-student/**'
      - '.github/workflows/build-student-apk.yml'
  pull_request:
    paths:
      - 'android-student/**'
      - '.github/workflows/build-student-apk.yml'

jobs:
  build-student:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android-student
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK to student.apk
        run: cp android-student/app/build/outputs/apk/debug/app-debug.apk student.apk
      - name: Upload student APK
        uses: actions/upload-artifact@v4
        with:
          name: student-apk
          path: student.apk
          if-no-files-found: error


  publish:
    needs: build-student
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: student-apk
          path: .
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: malawihub-student-v1.0.0
          name: MalawiHub Student Portal v1.0.0
          body: MalawiHub Student Portal v1.0.0 — installable Android APK for the Online Class student portal.
          files: student.apk
          make_latest: false
          prerelease: false
