name: Read-only Supabase schema export

on:
  push:
    branches: [feature/online-class-secure-enrollment]
    paths:
      - ".github/workflows/read-only-supabase-schema-export.yml"

permissions:
  contents: read

jobs:
  export-public-schema:
    name: Export public schema only (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secret is configured without displaying it
        env:
          MALAWIHUB_DB_URL: ${{ secrets.MALAWIHUB_DB_URL }}
        run: |
          if [ -z "$MALAWIHUB_DB_URL" ]; then
            echo "::error::Repository secret MALAWIHUB_DB_URL is missing or empty."
            exit 1
          fi
          echo "Database connection secret is present."

      - name: Dump public schema only
        env:
          MALAWIHUB_DB_URL: ${{ secrets.MALAWIHUB_DB_URL }}
        run: |
          set +x
          supabase db dump --db-url "$MALAWIHUB_DB_URL" --schema public --file public-schema.sql
          test -s public-schema.sql
          echo "Schema-only export created."

      - name: Upload schema export for review
        uses: actions/upload-artifact@v4
        with:
          name: malawihub-public-schema-read-only
          path: public-schema.sql
          if-no-files-found: error
          retention-days: 3
