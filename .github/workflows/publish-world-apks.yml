name: Publish MalawiHub World APK Pack

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-keyboard/**'
      - '.github/workflows/publish-world-apks.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Smart Keyboard
        working-directory: android-keyboard
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare Smart Keyboard APK
        run: cp android-keyboard/app/build/outputs/apk/debug/app-debug.apk malawihub-smart-keyboard.apk
      - name: Download latest successful Student APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh run list --workflow build-student-apk.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$ID"
          gh run download "$ID" --name student-apk --dir dist/student
          cp dist/student/student.apk student.apk
      - name: Download latest successful Teacher APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh run list --workflow build-teacher-apk.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$ID"
          gh run download "$ID" --name teacher-apk --dir dist/teacher
          cp dist/teacher/teacher.apk teacher.apk
      - name: Download latest successful Business Connector APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh run list --workflow build-connector.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$ID"
          gh run download "$ID" --name malawihub-business-connector-apk --dir dist/connector
          cp dist/connector/app-debug.apk business-connector.apk
      - name: Download latest signed Main Hub APK
        run: |
          curl -fsSL "https://github.com/malawhub/malawihub/releases/latest/download/app-release-signed.apk" -o main-hub.apk
          test -s main-hub.apk
      - name: Verify world APK pack
        run: |
          ls -lh main-hub.apk student.apk teacher.apk business-connector.apk malawihub-smart-keyboard.apk
      - name: Publish public world release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="malawihub-world-v1.0.${{ github.run_number }}"
          gh release create "$TAG" main-hub.apk student.apk teacher.apk business-connector.apk malawihub-smart-keyboard.apk --title "MalawiHub World APK Pack v1.0.${{ github.run_number }}" --notes "Official MalawiHub Android distribution pack. Includes Main Hub, Student Portal, Teacher Portal, Business Connector and Smart Keyboard. Admin APK is intentionally excluded."
      - name: Show release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "malawihub-world-v1.0.${{ github.run_number }}" --json url,name