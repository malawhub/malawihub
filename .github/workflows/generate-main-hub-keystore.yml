name: Generate Main Hub Signing Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing password
        shell: bash
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_PASSWORD"
          echo "Signing password is configured."

      - name: Generate new Main Hub keystore
        shell: bash
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          rm -f malawihub-release.keystore
          keytool -genkeypair \
            -keystore malawihub-release.keystore \
            -storetype JKS \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MalawiHub, OU=MalawiHub, O=MalawiHub, L=Malawi, C=MW"
          keytool -list -v \
            -keystore malawihub-release.keystore \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E 'Alias name:|Entry type:|SHA256:'
          sha256sum malawihub-release.keystore > malawihub-release.keystore.sha256

      - name: Package new keystore
        shell: bash
        run: |
          tar -czf malawihub-new-signing-keystore.tar.gz \
            malawihub-release.keystore \
            malawihub-release.keystore.sha256

      - name: Upload new keystore
        uses: actions/upload-artifact@v4
        with:
          name: malawihub-new-signing-keystore
          path: malawihub-new-signing-keystore.tar.gz
          retention-days: 7
