name: Repair Online Class student enrollment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live class enrollment flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('online-class/index.html')
          s=p.read_text()
          old=""" if(role==='teacher'){authUser=await getAuthUser();if(!authUser){$('loginNotice').classList.remove('hidden');alert('Please sign in to MalawiHub before starting a teacher class.');return}}\n const {data,error}=await supabaseClient.from('online_classes').select('*').eq('join_code',roomCode).maybeSingle();\n if(error||!data){alert('Class not found. Check the class code.');return}classData=data;classId=data.id;duration=data.duration_minutes||60;"""
          new=""" if(role==='teacher'){authUser=await getAuthUser();if(!authUser){$('loginNotice').classList.remove('hidden');alert('Please sign in to MalawiHub before starting a teacher class.');return}}\n if(role==='student'){authUser=await getAuthUser();if(!authUser){alert('Please sign in through the Student Portal before joining a class.');return}}\n let data,error;\n if(role==='student'){const joined=await supabaseClient.rpc('join_online_class',{p_join_code:roomCode});data=joined.data?.[0]||null;error=joined.error}else{const result=await supabaseClient.from('online_classes').select('*').eq('join_code',roomCode).maybeSingle();data=result.data;error=result.error}\n if(error||!data){alert(error?.message||'Class not found. Check the class code.');return}classData=data;classId=data.id;duration=data.duration_minutes||60;"""
          if old not in s:
              raise SystemExit('Target Online Class setupRoom block was not found; no change made.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit repair and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-class/index.html
          git rm .github/workflows/repair-online-class.yml
          git commit -m "Fix Online Class student enrollment" || exit 0
          git push
