name: Build MalawiHub Android App
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'android-connector/**'
      - 'manifest.json'
      - 'icons/**'

jobs:
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Business Connector debug APK
        working-directory: android-connector
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: malawihub-business-connector-apk
          path: android-connector/app/build/outputs/apk/debug/app-debug.apk

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Android signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are not configured; skipping signed Android build."
          fi
      - name: Checkout
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Setup Java
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Bubblewrap
        if: steps.signing.outputs.enabled == 'true'
        run: npm install -g @bubblewrap/cli
      - name: Initialise Android project
        if: steps.signing.outputs.enabled == 'true'
        run: bubblewrap init --manifest https://malawihub.pages.dev/manifest.json --directory android-app --skipPwaValidation
      - name: Restore signing key
        if: steps.signing.outputs.enabled == 'true'
        env: { ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }} }
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/malawihub-release.keystore
      - name: Build signed Android App Bundle
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-app
        env:
          BUBBLEWRAP_KEYSTORE: malawihub-release.keystore
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --signingKey "$BUBBLEWRAP_KEYSTORE" --signingKeyPassword "$BUBBLEWRAP_KEYSTORE_PASSWORD" --signingKeyAlias "$BUBBLEWRAP_KEY_ALIAS" --signingKeyAliasPassword "$BUBBLEWRAP_KEY_PASSWORD"
      - name: Upload Android App Bundle
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with: { name: malawihub-android-release, path: android-app/app-release-bundle.aab }
      - name: Upload APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with: { name: malawihub-android-apk, path: android-app/app-release-signed.apk }
