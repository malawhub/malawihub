name: Build MalawiHub Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'android-connector/**'
      - 'android-student/**'
      - 'android-teacher/**'
      - 'manifest.json'
      - '.github/workflows/build-android.yml'
      - 'icons/**'

jobs:
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Business Connector debug APK
        working-directory: android-connector
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: malawihub-business-connector-apk
          path: android-connector/app/build/outputs/apk/debug/app-debug.apk

  student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Student debug APK
        working-directory: android-student
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: malawihub-student-portal-apk
          path: android-student/app/build/outputs/apk/debug/app-debug.apk

  teacher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Teacher debug APK
        working-directory: android-teacher
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: malawihub-teacher-portal-apk
          path: android-teacher/app/build/outputs/apk/debug/app-debug.apk

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Android signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are not configured; skipping signed Android build."
          fi
      - name: Checkout
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Bubblewrap
        if: steps.signing.outputs.enabled == 'true'
        run: npm install -g @bubblewrap/cli
      - name: Setup Gradle
        if: steps.signing.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure Bubblewrap toolchain
        if: steps.signing.outputs.enabled == 'true'
        run: |
          SDK="/usr/local/lib/android/sdk"
          if [[ ! -d "$SDK/bin" ]]; then
            ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '%s\n' '{' '  "jdkPath": "'$JAVA_HOME'",' '  "androidSdkPath": "'$SDK'"' '}' > "$HOME/.bubblewrap/config.json"
          test -x "$JAVA_HOME/bin/java"
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/bin/sdkmanager"
      - name: Prepare Main Hub Android project
        if: steps.signing.outputs.enabled == 'true'
        run: |
          rm -rf android-app
          mkdir -p android-app
          cp android/twa-manifest.json android-app/twa-manifest.json
          cd android-app
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json
      - name: Restore signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/malawihub-release.keystore
      - name: Build signed Android App Bundle
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-app
        env:
          BUBBLEWRAP_KEYSTORE: malawihub-release.keystore
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i '/splashScreenFadeOutDuration:/d' app/build.gradle
          find . -type f \( -name '*.gradle' -o -name '*.json' \) -print0 | xargs -0 sed -i '/splashScreenFadeOutDuration/d'
          find . -type f -name '*.xml' -print0 | xargs -0 perl -0pi -e 's#\s*<meta-data\b[^>]*splashScreenFadeOutDuration[^>]*/>\s*##g'
          find . -type f -name '*.xml' -print0 | xargs -0 sed -i '/<integer name="splashScreenFadeOutDuration">null<\/integer>/d'
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle
          sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/g; s/compileSdk [0-9]+/compileSdk 36/g; s/targetSdkVersion [0-9]+/targetSdkVersion 36/g; s/targetSdk [0-9]+/targetSdk 36/g; s/buildToolsVersion "[0-9.]+"/buildToolsVersion "36.0.0"/g' app/build.gradle build.gradle
          cat >> app/build.gradle <<'EOF'
          
          configurations.all {
              resolutionStrategy.force 'androidx.core:core:1.12.0'
              resolutionStrategy.force 'androidx.core:core-ktx:1.12.0'
          }
          EOF
          gradle :app:bundleRelease --no-daemon --stacktrace --info
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$BUBBLEWRAP_KEYSTORE" --ks-pass pass:"$BUBBLEWRAP_KEYSTORE_PASSWORD" --ks-key-alias "$BUBBLEWRAP_KEY_ALIAS" --key-pass pass:"$BUBBLEWRAP_KEY_PASSWORD" --out app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Diagnose Main Hub merged resources
        if: always() && steps.signing.outputs.enabled == 'true'
        working-directory: android-app
        shell: bash
        run: |
          FILE="app/build/intermediates/incremental/release/mergeReleaseResources/merged.dir/values/values.xml"
          if [[ -f "$FILE" ]]; then
            echo "===== merged values.xml lines 70-100 ====="
            nl -ba "$FILE" | sed -n '70,100p'
            echo "===== integer resources ====="
            grep -nE '<integer|type="integer"' "$FILE" || true
          else
            echo "Merged values.xml was not produced."
            find app/build/intermediates -path '*/mergeReleaseResources/merged.dir/values/values.xml' -print || true
          fi

      - name: Prepare APK output
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-app
        run: cp app/build/outputs/bundle/release/app-release.aab app-release-bundle.aab
      - name: Upload Android App Bundle
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: malawihub-android-release
          path: android-app/app-release-bundle.aab
      - name: Upload APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: malawihub-android-apk
          path: android-app/app-release-signed.apk
