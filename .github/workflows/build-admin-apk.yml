name: Build and publish admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/build-admin-apk.yml'
  pull_request:
    paths:
      - 'android-admin/**'
      - '.github/workflows/build-admin-apk.yml'

permissions:
  contents: write

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable Admin APK
        working-directory: android-admin
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK to admin.apk
        run: cp android-admin/app/build/outputs/apk/debug/app-debug.apk admin.apk

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk
          path: admin.apk
          if-no-files-found: error

  publish:
    needs: build-admin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download admin APK
        uses: actions/download-artifact@v4
        with:
          name: admin-apk
          path: .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: malawihub-admin-v1.0.0
          name: MalawiHub Admin v1.0.0
          body: MalawiHub Admin Portal APK v1.0.0
          files: admin.apk
          make_latest: false
