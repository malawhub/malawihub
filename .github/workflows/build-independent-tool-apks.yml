name: Build and Publish Independent MalawiHub Tool APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-tools/**'
      - '.github/workflows/build-independent-tool-apks.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [gpa, chemistry, assignment, papers, grade, timetable, percentage, currency, profit, smartwriter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-tools
        run: gradle :app:assemble${{ matrix.flavor }}Release --no-daemon
      - name: Name APK
        working-directory: android-tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "dist/${{ matrix.flavor }}.apk"
          test -s "dist/${{ matrix.flavor }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: malawihub-${{ matrix.flavor }}-apk
          path: android-tools/dist/${{ matrix.flavor }}.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: malawihub-*-apk
          path: dist
          merge-multiple: true
      - name: Verify APK suite
        run: |
          set -euo pipefail
          ls -lh dist
          test -s dist/gpa.apk
          test -s dist/chemistry.apk
          test -s dist/assignment.apk
          test -s dist/papers.apk
          test -s dist/grade.apk
          test -s dist/timetable.apk
          test -s dist/percentage.apk
          test -s dist/currency.apk
          test -s dist/profit.apk
          test -s dist/smartwriter.apk
      - name: Publish worldwide release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="malawihub-tools-v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk --title "MalawiHub Independent Apps v1.0.${{ github.run_number }}" --notes "Official independent MalawiHub Android apps. Each APK is a separate installable app for one MalawiHub tool. Includes GPA Calculator Malawi, Chemistry Calculator Malawi, Assignment Cover Page Malawi, Past Papers Malawi, Grade Calculator Malawi, Study Timetable Malawi, Percentage Calculator Malawi, Currency Calculator Malawi, Profit Calculator Malawi and MalawiHub Smart Writer."
