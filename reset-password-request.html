<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub — Forgot Password</title><link rel="stylesheet" href="/css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;margin-top:40px;box-shadow:0 6px 24px #0001}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd3df;border-radius:10px;margin:7px 0}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px;background:#087f3f;color:#fff}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#f8fafc}.error{background:#fef2f2;color:#991b1b}.success{background:#ecfdf3;color:#065f46}</style></head><body><main class="wrap"><section class="card"><h1>🔑 Forgot Password</h1><p>Enter the email used for your MalawiHub account. We will send a secure password-reset link.</p><input id="email" class="input" type="email" placeholder="Your email" autocomplete="email"><button id="send" class="btn">Send Reset Link</button><p id="msg" class="msg"></p><p><a id="back" href="/online-class/landing.html">← Back</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/supabase.js"></script><script>const role=new URLSearchParams(location.search).get('role')||'student';const back=document.getElementById('back');back.href=role==='teacher'?'/teacher-portal/':role==='admin'?'/admin/login.html':'/student-portal/';const m=document.getElementById('msg');document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim().toLowerCase();if(!email){m.textContent='Enter your email.';m.className='msg error';return}m.textContent='Sending…';m.className='msg';try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});if(error)throw error;m.textContent='✅ If the account exists, a password-reset link has been sent. Check the email inbox and spam folder.';m.className='msg success'}catch(e){m.textContent=e.message||'Could not send the reset link.';m.className='msg error'}}</script></body></html>
