<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MalawiHub Offline</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17251d}
header{background:#087f3f;color:#fff;padding:16px;text-align:center}main{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0001}
h1,h2{text-align:center}.muted{color:#66736b;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea,button{width:100%;padding:12px;border-radius:8px;border:1px solid #ccd5cf;font-size:16px;margin:6px 0}
button{background:#087f3f;color:#fff;border:0;font-weight:bold}.secondary{background:#53615a}.result{margin-top:12px;padding:14px;background:#eef7f1;border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.writer{min-height:420px;outline:0;border:1px solid #ccd5cf;border-radius:10px;padding:16px;background:#fff;font-size:18px;line-height:1.6;white-space:pre-wrap}
@media(max-width:560px){.grid,.row{grid-template-columns:1fr}}
</style></head><body>
<header><strong>🇲🇼 MalawiHub</strong><div>Offline mode</div></header><main>
<div class="card"><h1 id="title">MalawiHub Tool</h1><p class="muted" id="note">This app is working without internet.</p></div>
<div id="app"></div>
</main>
<script>
const tool=new URLSearchParams(location.search).get("tool")||"gpa";
const app=document.getElementById("app"),title=document.getElementById("title"),note=document.getElementById("note");
function shell(name,desc,body){title.textContent=name;note.textContent=desc;app.innerHTML='<div class="card">'+body+'</div>'}
function out(x){document.getElementById("out").innerHTML=x}
if(tool==="chemistry") shell("Chemistry Calculator Malawi","Molar mass calculation is fully available offline.",
'<input id="f" placeholder="Example: H2SO4"><button onclick="chem()">Calculate Molar Mass</button><div id="out" class="result"></div>');
else if(tool==="percentage") shell("Percentage Calculator Malawi","All calculations work offline.",
'<div class="grid"><div><input id="a" type="number" placeholder="Value"></div><div><input id="b" type="number" placeholder="Total"></div></div><button onclick="pct()">Calculate percentage</button><div id="out" class="result"></div>');
else if(tool==="profit") shell("Profit Calculator Malawi","All calculations work offline.",
'<div class="row"><input id="c" type="number" placeholder="Cost/item"><input id="s" type="number" placeholder="Selling/item"></div><input id="q" type="number" placeholder="Quantity"><button onclick="profit()">Calculate Profit</button><div id="out" class="result"></div>');
else if(tool==="currency") shell("Currency Calculator Malawi","Uses the app's stored example rates offline. Live rates require internet.",
'<input id="amt" type="number" value="1"><div class="row"><select id="from"><option>MWK</option><option>USD</option><option>ZAR</option><option>GBP</option><option>EUR</option><option>ZMW</option><option>TZS</option></select><select id="to"><option>USD</option><option>MWK</option><option>ZAR</option><option>GBP</option><option>EUR</option><option>ZMW</option><option>TZS</option></select></div><button onclick="currency()">Convert</button><div id="out" class="result"></div>');
else if(tool==="grade") shell("Grade Calculator Malawi","Enter marks and calculate an average offline.",
'<div id="marks"><input class="m" type="number" placeholder="Mark (%)"></div><button onclick="addMark()">+ Add mark</button><button onclick="grade()">Calculate Grade</button><div id="out" class="result"></div>');
else if(tool==="gpa") shell("GPA Calculator Malawi","Offline GPA uses a simple 4.0 scale. The online app provides university-specific verified scales.",
'<div id="courses"><div class="row"><input class="cr" type="number" placeholder="Credits"><input class="gp" type="number" step=".01" min="0" max="4" placeholder="Grade points (0-4)"></div></div><button onclick="addCourse()">+ Add course</button><button onclick="gpa()">Calculate GPA</button><div id="out" class="result"></div>');
else if(tool==="timetable") shell("Study Timetable Malawi","Your timetable is stored on this device and works offline.",
'<input id="day" placeholder="Day"><input id="subject" placeholder="Subject"><input id="time" placeholder="Time"><button onclick="saveSlot()">Save timetable entry</button><div id="out" class="result"></div>');
else if(tool==="assignment") shell("Assignment Cover Page Malawi","Basic cover creation and printing work offline. Online mode adds synced/premium features.",
'<input id="school" placeholder="School/University"><input id="dept" placeholder="Department"><input id="course" placeholder="Course"><input id="title2" placeholder="Assignment title"><input id="name" placeholder="Student name"><input id="reg" placeholder="Registration number"><button onclick="cover()">Create Cover</button><div id="out" class="result"></div>');
else if(tool==="smartwriter") shell("MalawiHub Smart Writer","Basic writing works offline and is saved on this device.",
'<div id="writer" class="writer" contenteditable="true"></div><button onclick="saveWriter()">Save offline</button><button class="secondary" onclick="window.print()">Print</button><div id="out" class="result"></div>');
else if(tool==="papers") shell("Past Papers Malawi","The online catalogue needs internet. Offline mode can keep notes about papers you have already downloaded to this phone.",
'<textarea id="paperNote" rows="8" placeholder="Record paper names, courses or where your downloaded papers are stored..."></textarea><button onclick="savePaperNote()">Save offline notes</button><div id="out" class="result"></div>');
else shell("MalawiHub Offline","This tool has opened in offline mode.","<p>You can continue using the offline features available in this app. Reconnect to the internet for the full online version.</p>");

const M={H:1.008,He:4.003,Li:6.94,Be:9.012,B:10.81,C:12.011,N:14.007,O:15.999,F:18.998,Ne:20.18,Na:22.99,Mg:24.305,Al:26.982,Si:28.085,P:30.974,S:32.06,Cl:35.45,Ar:39.948,K:39.098,Ca:40.078,Sc:44.956,Ti:47.867,V:50.942,Cr:52,Mn:54.938,Fe:55.845,Co:58.933,Ni:58.693,Cu:63.546,Zn:65.38,Ga:69.723,Ge:72.63,As:74.922,Se:78.971,Br:79.904,Kr:83.798,Rb:85.468,Sr:87.62,Y:88.906,Zr:91.224,Nb:92.906,Mo:95.95,Ag:107.868,Cd:112.414,Sn:118.71,I:126.904,Ba:137.327,Pt:195.084,Au:196.967,Hg:200.592,Pb:207.2,U:238.029};
function chem(){let f=document.getElementById("f").value.replace(/\s/g,"");try{let i=0;function num(){let s=i;while(/\d/.test(f[i]))i++;return s==i?1:+f.slice(s,i)}function group(close){let a={};while(i<f.length){if(close&&f[i]==close){i++;return a}if(f[i]=="("){i++;let x=group(")"),n=num();for(let e in x)a[e]=(a[e]||0)+x[e]*n;continue}if(!/[A-Z]/.test(f[i]))throw Error("Invalid formula");let e=f[i++];if(/[a-z]/.test(f[i]))e+=f[i++];if(!M[e])throw Error("Unknown element: "+e);let n=num();a[e]=(a[e]||0)+n}if(close)throw Error("Missing closing bracket");return a}let a=group(),mass=0;for(let e in a)mass+=a[e]*M[e];out("<b>"+f+" = "+mass.toFixed(2)+" g/mol</b>")}catch(e){out("<b>Error:</b> "+e.message)}}
function pct(){let a=+document.getElementById("a").value,b=+document.getElementById("b").value;out(b?"<b>"+((a/b)*100).toFixed(2)+"%</b>":"Enter a valid total.")}
function profit(){let c=+document.getElementById("c").value,s=+document.getElementById("s").value,q=+document.getElementById("q").value,p=(s-c)*q;out("Total cost: MK "+(c*q).toFixed(2)+"<br>Revenue: MK "+(s*q).toFixed(2)+"<br><b>"+(p>=0?"Profit":"Loss")+": MK "+p.toFixed(2)+"</b>")}
const rates={MWK:1,USD:1730,ZAR:95,GBP:2350,EUR:2010,ZMW:70,TZS:.67};function currency(){let a=+amt.value,r=rates[from.value]/rates[to.value];out("<b>"+(a*r).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+" "+to.value+"</b><br>Stored offline rate: 1 "+from.value+" ≈ "+r.toFixed(4)+" "+to.value)}
function addMark(){marks.insertAdjacentHTML("beforeend",'<input class="m" type="number" placeholder="Mark (%)">')}function grade(){let x=[...document.querySelectorAll(".m")].map(e=>+e.value).filter(Number.isFinite);let a=x.reduce((p,v)=>p+v,0)/x.length;let g=a>=80?"A":a>=70?"B":a>=60?"C":a>=50?"D":"F";out("Average: <b>"+a.toFixed(2)+"%</b><br>Grade: <b>"+g+"</b>")}
function addCourse(){courses.insertAdjacentHTML("beforeend",'<div class="row"><input class="cr" type="number" placeholder="Credits"><input class="gp" type="number" step=".01" min="0" max="4" placeholder="Grade points (0-4)"></div>')}function gpa(){let c=[...document.querySelectorAll(".cr")],p=[...document.querySelectorAll(".gp")],tc=0,tp=0;c.forEach((e,i)=>{let x=+e.value,y=+p[i].value;if(x>0&&y>=0){tc+=x;tp+=x*y}});out(tc?"GPA: <b>"+(tp/tc).toFixed(2)+" / 4.00</b>":"Enter course credits and grade points.")}
function saveSlot(){let v=(localStorage.slots||"");v+=(v?"\n":"")+day.value+" | "+time.value+" | "+subject.value;localStorage.slots=v;out("<b>Saved.</b><br>"+v.replace(/\n/g,"<br>"))}
function cover(){out('<div style="padding:25px;text-align:center;border:2px solid #222"><h2>ASSIGNMENT</h2><h3>'+school.value+'</h3><p>'+dept.value+'</p><h2>'+course.value+'</h2><h3>'+title2.value+'</h3><p>Student: '+name.value+'</p><p>Registration: '+reg.value+'</p><button onclick="window.print()">Print Cover</button></div>')}
writer.innerHTML=localStorage.writer||"";function saveWriter(){localStorage.writer=writer.innerText;out("<b>Saved on this device.</b>")}paperNote.value=localStorage.paperNote||"";function savePaperNote(){localStorage.paperNote=paperNote.value;out("<b>Saved on this device.</b>")}
</script></body></html>
