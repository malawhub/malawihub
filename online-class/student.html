<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Student Live Class</title><link rel="stylesheet" href="../css/style.css"><style>body{margin:0;background:#f5f7fb}.bar{padding:12px 16px;background:#fff;border-bottom:1px solid #e4e7ec;font-weight:800}.bar span{color:#667085;font-weight:500;font-size:13px;margin-left:8px}.frame{width:100%;height:calc(100vh - 52px);border:0;display:block}</style></head><body><div class="bar">🇲🇼 MalawiHub Student Live Class <span>Student Portal</span></div><iframe id="classroom" class="frame" src="./index.html?student=1" title="Student Live Class"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const frame=document.getElementById('classroom');async function guard(){const {data}=await supabaseClient.auth.getUser();if(!data?.user){location.href='./login.html';return}const {data:p}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(!p||p.role!=='student'){await supabaseClient.auth.signOut();location.href='./login.html';return}}frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d)return;const teacher=d.getElementById('teacherBtn');if(teacher)teacher.remove();const top=d.querySelector('.top');if(top){const a=top.querySelector('a[href="../index.html"]');if(a)a.remove()}const notice=d.getElementById('loginNotice');if(notice)notice.remove()}catch(e){}});guard();</script></body></html>
