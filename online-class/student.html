<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MalawiHub Student Portal</title>
<meta http-equiv="Cache-Control" content="no-store">
</head>
<body>
<p>Opening the MalawiHub Student Portal…</p>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || params.get('class') || params.get('join_code') || '').trim();
  const target = new URL('../student-portal/classroom.html', location.href);
  if (code) target.searchParams.set('code', code);
  location.replace(target.toString());
})();
</script>
<script src="/js/official-app.js?v=2" defer></script></body>
</html>
