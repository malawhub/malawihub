<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Learning Resources | MalawiHub</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #00000012}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.btn{display:inline-block;padding:10px 14px;border-radius:9px;background:#0d6efd;color:#fff;text-decoration:none;font-weight:700}.muted{color:#667085}.input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3df;border-radius:10px}.item{border:1px solid #e4e7ec;border-radius:12px;padding:12px}.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px}@media(max-width:650px){.filters{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div><b>🇲🇼 MalawiHub Student Learning Resources</b> · <a href="./student.html">My Classes</a> · <a href="./login.html">Student Login</a></div><p class="muted">Selected learning materials from the Main MalawiHub only: <b>Past Papers</b> and <b>Subject Notes</b>.</p></div><div class="card"><h2>📄 Past Papers</h2><div class="filters"><input id="paperSearch" class="input" placeholder="Search past papers..."><select id="paperSubject" class="input"><option value="">All Subjects</option></select></div><div id="papers" class="grid" style="margin-top:12px"></div></div><div class="card"><h2>📚 Subject Notes</h2><div class="filters"><input id="noteSearch" class="input" placeholder="Search subject notes..."><select id="noteSubject" class="input"><option value="">All Subjects</option></select></div><div id="notes" class="grid" style="margin-top:12px"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}async function guard(){const {data}=await supabaseClient.auth.getUser();if(!data?.user){location.href='./login.html';return false}const {data:p}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(p?.role!=='student'){await supabaseClient.auth.signOut();location.href='./login.html';return false}return true}let papers=[],notes=[];function fillSelect(id,values){$(id).innerHTML='<option value="">All Subjects</option>'+[...new Set(values.filter(Boolean))].sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}function render(){const pq=$('paperSearch').value.toLowerCase().trim(),ps=$('paperSubject').value;const pf=papers.filter(p=>(!pq||[p.title,p.subject,p.category,p.description,p.year].map(v=>String(v||'').toLowerCase()).join(' ').includes(pq))&&(!ps||p.subject===ps));$('papers').innerHTML=pf.length?pf.map(p=>'<article class="item"><h3>'+esc(p.title)+'</h3><p class="muted">'+esc(p.subject||'General')+' · '+esc(p.year||'')+'</p><p>'+esc(p.description||'')+'</p><a class="btn" href="'+esc(p.link)+'" target="_blank" rel="noopener">Open Paper</a></article>').join(''):'<p class="muted">No past papers found.</p>';const nq=$('noteSearch').value.toLowerCase().trim(),ns=$('noteSubject').value;const nf=notes.filter(n=>(!nq||[n.title,n.subject,n.topic,n.category,n.description].map(v=>String(v||'').toLowerCase()).join(' ').includes(nq))&&(!ns||n.subject===ns));$('notes').innerHTML=nf.length?nf.map(n=>'<article class="item"><h3>'+esc(n.title)+'</h3><p class="muted">'+esc(n.subject||'General')+' · '+esc(n.topic||'General')+'</p><p>'+esc(n.description||'Learning note.')+'</p><a class="btn" href="'+esc(n.link)+'" target="_blank" rel="noopener">Open Notes</a></article>').join(''):'<p class="muted">No subject notes found.</p>'}async function load(){if(!(await guard()))return;const [pr,nr]=await Promise.all([supabaseClient.from('past_papers').select('*').order('year',{ascending:false}),supabaseClient.from('subject_resources').select('*').order('created_at',{ascending:false})]);papers=pr.data||[];notes=(nr.data||[]).filter(n=>{const c=String(n.category||'').toLowerCase();return !c||c.includes('note')||c.includes('study')||c.includes('subject')});fillSelect('paperSubject',papers.map(p=>p.subject));fillSelect('noteSubject',notes.map(n=>n.subject));render()}['paperSearch','paperSubject','noteSearch','noteSubject'].forEach(id=>$(id).addEventListener(id.includes('Search')?'input':'change',render));load();</script></body></html>
