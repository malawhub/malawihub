<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening Teacher Classroom</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="refresh" content="0;url=./index.html?teacher=1&amp;role=teacher&amp;mode=teacher">
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var code=(p.get('code')||p.get('class')||p.get('join_code')||'').trim();
  try {
    sessionStorage.removeItem('malawihub_student_portal');
    sessionStorage.removeItem('malawihub_class_code');
  } catch(e) {}
  var target=new URL('./index.html',location.href);
  target.searchParams.set('teacher','1');
  target.searchParams.set('role','teacher');
  target.searchParams.set('mode','teacher');
  if(code) target.searchParams.set('code',code);
  target.searchParams.set('v','20261013-direct-class-final');
  location.replace(target.toString());
})();
</script>
</head>
<body style="margin:0;background:#f5f7fb"></body>
</html>
