<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Class Administration</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000d}.row{display:flex;gap:10px;flex-wrap:wrap}.input{padding:11px;border:1px solid #ccd3df;border-radius:10px;flex:1;min-width:160px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#0d6efd;color:#fff}.danger{background:#dc3545;color:#fff}.muted{color:#667085}.code{font-size:24px;font-weight:900;letter-spacing:2px}.item{border:1px solid #e4e7ec;border-radius:14px;padding:14px;margin:8px 0}.resource-form{display:grid;gap:9px}.resource-form input,.resource-form textarea{padding:11px;border:1px solid #ccd3df;border-radius:10px;width:100%;font:inherit}.resource-form textarea{min-height:80px;resize:vertical}.success{background:#ecfdf3;color:#067647;padding:10px;border-radius:10px}</style></head><body><div class="wrap"><div class="card"><b>🇲🇼 MalawiHub Class Administration</b><p id="who" class="muted">Checking account…</p><p id="error" style="background:#fee4e2;color:#b42318;padding:8px;border-radius:8px;display:none"></p></div><div id="panel" style="display:none"><div class="card"><h2>Create a Class</h2><div class="row"><input id="title" class="input" placeholder="Class title"><input id="subject" class="input" placeholder="Subject"><input id="duration" class="input" type="number" min="5" max="240" value="60" placeholder="Minutes"><button id="create" class="btn primary">Generate Class Code</button></div><div id="created" style="margin-top:14px"></div></div><div class="card"><h2>🎥 Add Video Resources</h2><p class="muted">Attach YouTube, Vimeo or direct video links to a class. Students will see them in the class resources area.</p><div class="resource-form"><input id="resourceCode" placeholder="Class code, e.g. MH-A7K2PQ"><input id="resourceTitle" placeholder="Video title"><textarea id="resourceDescription" placeholder="Short description (optional)"></textarea><input id="resourceUrl" type="url" placeholder="Video URL (YouTube, Vimeo or direct MP4 link)"><button id="addResource" class="btn primary">＋ Add Video Resource</button><div id="resourceMsg"></div></div></div><div class="card"><h2>Your Classes</h2><div id="classes"><span class="muted">Loading…</span></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id);let user=null;function showError(x){$('error').textContent=x;$('error').style.display='block'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function makeCode(){return'MH-'+Math.random().toString(36).slice(2,8).toUpperCase()}async function init(){const r=await supabaseClient.auth.getUser();user=r.data?.user;if(!user){showError('Sign in to MalawiHub first.');return}$('who').textContent='Signed in as '+(user.email||user.id);const a=await supabaseClient.rpc('is_online_class_admin');if(a.error||a.data!==true){showError('Administrator access is required for this page.');return}$('panel').style.display='block';await load()}async function load(){const {data,error}=await supabaseClient.from('online_classes').select('id,join_code,title,subject,duration_minutes,status,starts_at,created_at').eq('teacher_id',user.id).order('created_at',{ascending:false});if(error){showError(error.message);return}const el=$('classes');el.innerHTML='';if(!data?.length){el.innerHTML='<span class="muted">No classes yet.</span>';return}data.forEach(c=>{const d=document.createElement('div');d.className='item';d.innerHTML='<div class="code">'+esc(c.join_code)+'</div><b>'+esc(c.title||'MalawiHub Live Class')+'</b> · '+esc(c.subject||'')+'<br><span class="muted">'+c.duration_minutes+' minutes · '+esc(c.status)+'</span><br><a href="./index.html?code='+encodeURIComponent(c.join_code)+'">Open class</a> · <a href="./resources.html?code='+encodeURIComponent(c.join_code)+'">🎥 View videos</a>';el.appendChild(d)})}$('create').onclick=async()=>{if(!user)return;const title=$('title').value.trim()||'MalawiHub Live Class',subject=$('subject').value.trim(),duration=Math.min(240,Math.max(5,Number($('duration').value)||60));let code=makeCode();for(let i=0;i<8;i++){const {error}=await supabaseClient.from('online_classes').insert({join_code:code,title,subject,duration_minutes:duration,teacher_id:user.id,status:'scheduled'});if(!error){$('created').innerHTML='<p class="success">Class created. Give students this code:</p><div class="code">'+esc(code)+'</div><a href="./index.html?code='+encodeURIComponent(code)+'">Open Class</a> · <a href="./resources.html?code='+encodeURIComponent(code)+'">Add/View Videos</a>';await load();return}if(error.code!=='23505'){showError(error.message);return}code=makeCode()}showError('Could not generate a unique class code. Try again.')};$('addResource').onclick=async()=>{const code=$('resourceCode').value.trim().toUpperCase(),title=$('resourceTitle').value.trim(),description=$('resourceDescription').value.trim(),url=$('resourceUrl').value.trim();$('resourceMsg').textContent='';if(!code||!title||!url){$('resourceMsg').textContent='Enter class code, video title and video URL.';return}const {data:c,error:ce}=await supabaseClient.from('online_classes').select('id').eq('join_code',code).maybeSingle();if(ce||!c){$('resourceMsg').textContent='Class code not found.';return}const {error}=await supabaseClient.from('class_video_resources').insert({class_id:c.id,title,description,video_url:url});if(error){$('resourceMsg').textContent=error.message;return}$('resourceMsg').innerHTML='<div class="success">Video resource added successfully.</div>';$('resourceTitle').value='';$('resourceDescription').value='';$('resourceUrl').value=''};init();</script></body></html>
