<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Online Class Login</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000d}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{flex:1;padding:12px;border:1px solid #ccd3df;border-radius:10px;background:#fff;font-weight:700}.tab.active{background:#0d6efd;color:#fff}.input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:10px;margin:6px 0}.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#0d6efd;color:#fff}.muted{color:#667085;font-size:13px}.msg{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc}</style></head><body><div class="wrap"><div class="card"><h1>🇲🇼 MalawiHub Online Classes</h1><p class="muted">Choose how you are entering the Online Class system.</p><div class="tabs"><button id="teacherTab" class="tab active">👨‍🏫 Teacher</button><button id="studentTab" class="tab">👨‍🎓 Student</button></div><div id="teacherPanel"><h2>Teacher Login</h2><p class="muted">Teachers must be registered by a MalawiHub administrator.</p><input id="te" class="input" type="email" placeholder="Teacher email"><input id="tp" class="input" type="password" placeholder="Password"><button id="tLogin" class="btn primary">Log in as Teacher</button><p id="tMsg" class="msg"></p></div><div id="studentPanel" style="display:none"><h2>Student Login</h2><p class="muted">Students can create their own MalawiHub student account.</p><input id="se" class="input" type="email" placeholder="Student email"><input id="sp" class="input" type="password" placeholder="Password (8+ characters)"><button id="sLogin" class="btn primary">Log in as Student</button><button id="sSignup" class="btn" style="margin-top:8px">Create Student Account</button><p id="sMsg" class="msg"></p></div><p><a href="./index.html">Continue to Live Class</a> · <a href="../index.html">MalawiHub</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id);function tab(t){$('teacherPanel').style.display=t==='teacher'?'block':'none';$('studentPanel').style.display=t==='student'?'block':'none';$('teacherTab').classList.toggle('active',t==='teacher');$('studentTab').classList.toggle('active',t==='student')}async function login(email,password,expected){const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;const {data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(expected==='teacher'&&!['teacher','admin'].includes(p?.role)){await supabaseClient.auth.signOut();throw Error('This account is not registered as a teacher. Ask the administrator to register you.')}if(expected==='student'&&p?.role==='teacher'){await supabaseClient.auth.signOut();throw Error('Teacher accounts must use Teacher Login.')}if(expected==='student'&&p?.role==='admin'){await supabaseClient.auth.signOut();throw Error('Administrator accounts must use the administrator area.')}if(expected==='teacher')location.href='./teacher.html';else location.href='./index.html?role=student'}$('teacherTab').onclick=()=>tab('teacher');$('studentTab').onclick=()=>tab('student');$('tLogin').onclick=async()=>{const m=$('tMsg');m.textContent='Signing in…';try{await login($('te').value.trim(),$('tp').value,'teacher')}catch(e){m.textContent=e.message||'Teacher login failed.'}};$('sLogin').onclick=async()=>{const m=$('sMsg');m.textContent='Signing in…';try{await login($('se').value.trim(),$('sp').value,'student')}catch(e){m.textContent=e.message||'Student login failed.'}};$('sSignup').onclick=async()=>{const email=$('se').value.trim(),password=$('sp').value;if(password.length<8){$('sMsg').textContent='Password must be at least 8 characters.';return}$('sMsg').textContent='Creating account…';const {data,error}=await supabaseClient.auth.signUp({email,password});if(error){$('sMsg').textContent=error.message;return}if(data.user){const {error:pe}=await supabaseClient.from('profiles').upsert({id:data.user.id,email,role:'student'},{onConflict:'id'});if(pe){$('sMsg').textContent=pe.message;return}}$('sMsg').textContent=data.session?'Student account created. Opening Live Class…':'Account created. Check your email to confirm, then log in as Student.';if(data.session)setTimeout(()=>location.href='./index.html?role=student',500)};</script></body></html>
