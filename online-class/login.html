<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Student Portal</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000d}.input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:10px;margin:6px 0;box-sizing:border-box}.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#0d6efd;color:#fff}.secondary{background:#eef2f7;color:#172033}.muted{color:#667085;font-size:13px}.msg{margin-top:10px;padding:12px;border-radius:10px;background:#f8fafc;line-height:1.5}.success{background:#ecfdf3;border:1px solid #a7f3d0;color:#065f46}.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.hidden{display:none}.confirm{margin-top:12px;padding:14px;border-radius:12px;background:#fff;border:1px solid #e4e7ec}.confirm b{color:#172033}</style></head><body><div class="wrap"><div class="card"><h1>🇲🇼 MalawiHub Student Portal</h1><p class="muted">This is the private student portal for registered MalawiHub Online Class students. It is separate from the Main MalawiHub and from the private Teacher Portal.</p><input id="email" class="input" type="email" placeholder="Student email" autocomplete="username"><input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password"><button id="login" class="btn primary">Log in as Student</button><button id="register" class="btn secondary">Create Student Account</button><p id="msg" class="msg"></p><div id="confirm" class="confirm hidden"></div><p><a href="./landing.html">← Online Classes</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id),msg=$('msg'),confirmBox=$('confirm');function showMsg(text,type=''){msg.textContent=text;msg.className='msg '+type}function showConfirmation(email,emailSent,needsConfirm){confirmBox.className='confirm';confirmBox.innerHTML='<b>Registration details</b><br>Email: '+esc(email)+'<br>Status: <b>Account created successfully</b><br>'+ (needsConfirm?'Please check your email and click the confirmation link before logging in.':'You can now log in with this email and password.')+'<br>'+ (emailSent?'A MalawiHub welcome email has been sent to you.':'Welcome email could not be sent automatically. Your account is still registered.')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('login').onclick=async()=>{showMsg('Signing in…');confirmBox.className='confirm hidden';try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;const {data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(p?.role!=='student'){await supabaseClient.auth.signOut();throw Error('This account is not registered as a student.')}showMsg('✅ Login successful. Opening the Student Portal…','success');location.href='./index.html'}catch(e){showMsg(e.message||'Student login failed.','error')}};$('register').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){showMsg('Enter an email and password first.','error');return}if(password.length<6){showMsg('Password must be at least 6 characters.','error');return}$('register').disabled=true;confirmBox.className='confirm hidden';showMsg('Creating student account…');try{const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)throw error;if(!data.user)throw Error('The account could not be created. Please try again.');const {error:profileError}=await supabaseClient.from('profiles').upsert({id:data.user.id,email,role:'student'},{onConflict:'id'});if(profileError)throw profileError;let emailSent=false;try{const r=await fetch('https://cdqrdovgdidzxmyygoee.supabase.co/functions/v1/send-student-welcome-email',{method:'POST',headers:{'Content-Type':'application/json',apikey:MH_SUPABASE_KEY},body:JSON.stringify({user_id:data.user.id})});emailSent=r.ok}catch(_){}const needsConfirm=!data.session;showMsg('✅ Student registration successful. Your account has been created.','success');showConfirmation(email,emailSent,needsConfirm);if(data.session)await supabaseClient.auth.signOut()}catch(e){showMsg(e.message||'Could not create the student account.','error')}finally{$('register').disabled=false}};</script></body></html>
