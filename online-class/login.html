<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Student Login</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000d}.input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:10px;margin:6px 0;box-sizing:border-box}.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#0d6efd;color:#fff}.muted{color:#667085;font-size:13px}.msg{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc}</style></head><body><div class="wrap"><div class="card"><h1>🇲🇼 MalawiHub Student Login</h1><p class="muted">Student accounts are registered by the MalawiHub administrator or by a teacher authorized by the administrator.</p><input id="email" class="input" type="email" placeholder="Registered student email"><input id="password" class="input" type="password" placeholder="Password"><button id="login" class="btn primary">Log in as Student</button><p id="msg" class="msg"></p><p><a href="./index.html">Continue to Live Class</a> · <a href="../index.html">MalawiHub</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id);$('login').onclick=async()=>{const m=$('msg');m.textContent='Signing in…';try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;const {data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(p?.role!=='student'){await supabaseClient.auth.signOut();throw Error('This account is not registered as a student. Contact the administrator.')}location.href='./index.html'}catch(e){m.textContent=e.message||'Student login failed.'}};</script></body></html>
