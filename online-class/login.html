<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Student Portal</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000d}.input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:10px;margin:6px 0;box-sizing:border-box}.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#0d6efd;color:#fff}.muted{color:#667085;font-size:13px}.msg{margin-top:10px;padding:12px;border-radius:10px;background:#f8fafc;line-height:1.5}.success{background:#ecfdf3;border:1px solid #a7f3d0;color:#065f46}.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}</style></head><body><div class="wrap"><div class="card"><h1>🇲🇼 MalawiHub Student Portal</h1><p class="muted">Private Online Class student area. It is separate from the Main MalawiHub and Business Hub.</p><p class="muted"><b>Student account:</b> Your administrator creates your username, email and password and sends the details to your email.</p><input id="username" class="input" placeholder="Username" autocomplete="username"><input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password"><button id="login" class="btn primary">Log in as Student</button><p id="msg" class="msg"></p><p><a href="./landing.html">← Online Classes</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id),msg=$('msg');function showMsg(text,type=''){msg.textContent=text;msg.className='msg '+type}$('login').onclick=async()=>{showMsg('Signing in…');try{const username=$('username').value.trim().toLowerCase();if(!username)throw Error('Enter your username.');const {data:p,error:pe}=await supabaseClient.from('profiles').select('id,email,role').ilike('username',username).maybeSingle();if(pe)throw pe;if(!p||p.role!=='student')throw Error('Student username not found.');if(!p.email)throw Error('This student account has no email.');const {data,error}=await supabaseClient.auth.signInWithPassword({email:p.email,password:$('password').value});if(error)throw error;showMsg('✅ Login successful. Opening the Student Portal…','success');location.href='./student.html'}catch(e){showMsg(e.message||'Student login failed.','error')}};</script></body></html>
