<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalawiHub Class Video Resources</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7fb}.wrap{max-width:1050px;margin:auto;padding:18px}.panel{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000d}.input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:10px;margin:5px 0}.btn{border:0;border-radius:10px;padding:11px 16px;background:#1769aa;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.muted{color:#667085}.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.video-card{border:1px solid #e4e7ec;border-radius:16px;padding:14px;background:#fff}.video-card iframe,.video-card video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#111}.video-card h3{margin:10px 0 3px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff;color:#1769aa;font-size:12px;font-weight:700}</style></head><body><div class="wrap"><div class="panel"><b>🇲🇼 MalawiHub Class Video Resources</b><p class="muted">Teacher-provided videos and lesson links for a class.</p><div><input id="code" class="input" placeholder="Enter class code (e.g. MH-A7K2PQ)"><button id="load" class="btn">Load Class Videos</button></div></div><div id="classInfo" class="panel" style="display:none"></div><div id="videos" class="video-grid"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>const $=id=>document.getElementById(id);let channel,code='';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function yt(u){try{const x=new URL(u);if(x.hostname.includes('youtu.be'))return 'https://www.youtube.com/embed/'+x.pathname.slice(1).split('?')[0];if(x.hostname.includes('youtube.com')){const id=x.searchParams.get('v');if(id)return 'https://www.youtube.com/embed/'+id;const m=x.pathname.match(/\/shorts\/([^/]+)/);if(m)return 'https://www.youtube.com/embed/'+m[1]}}catch(e){}return null}function render(rows){const el=$('videos');el.innerHTML='';if(!rows?.length){el.innerHTML='<div class="panel"><b>No video resources yet.</b><p class="muted">Your teacher has not added any videos for this class.</p></div>';return}rows.forEach(r=>{const c=document.createElement('article');c.className='video-card';const embed=yt(r.video_url);if(embed)c.innerHTML='<iframe src="'+embed+'" title="'+esc(r.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';else c.innerHTML='<div style="aspect-ratio:16/9;display:grid;place-items:center;background:#101828;border-radius:12px;color:white;font-size:40px">▶️</div>';c.innerHTML+='<span class="tag">Video resource</span><h3>'+esc(r.title)+'</h3><p class="muted">'+esc(r.description||'')+'</p><a href="'+esc(r.video_url)+'" target="_blank" rel="noopener">Open video ↗</a>';el.appendChild(c)})}async function load(){code=$('code').value.trim().toUpperCase();if(!code){alert('Enter a class code.');return}const {data:c,error}=await supabaseClient.from('online_classes').select('id,title,subject,status').eq('join_code',code).maybeSingle();if(error||!c){$('classInfo').style.display='block';$('classInfo').innerHTML='<b>Class not found.</b><p class="muted">Check the class code and try again.</p>';return}$('classInfo').style.display='block';$('classInfo').innerHTML='<h2>🎥 '+esc(c.title||'MalawiHub Live Class')+'</h2><p class="muted">'+esc(c.subject||'')+' · '+esc(c.status)+'</p>';const r=await supabaseClient.from('class_video_resources').select('*').eq('class_id',c.id).order('created_at',{ascending:true});if(r.error){$('videos').innerHTML='<div class="panel">'+esc(r.error.message)+'</div>';return}render(r.data);if(channel)await supabaseClient.removeChannel(channel);channel=supabaseClient.channel('malawihub-resources-'+code).on('postgres_changes',{event:'*',schema:'public',table:'class_video_resources',filter:'class_id=eq.'+c.id},()=>load()).subscribe()}$('load').onclick=load;const q=new URLSearchParams(location.search).get('code');if(q){$('code').value=q;load()}</script></body></html>
