<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MalawiHub Administrator Classroom</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f5f7fb;font-family:Arial,sans-serif}#guard{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#17352b;padding:20px;box-sizing:border-box}#guard .box{background:#fff;border-radius:18px;padding:28px;max-width:520px;box-shadow:0 8px 30px #0001}iframe{display:none;width:100%;height:100%;border:0}</style></head>
<body><div id="guard"><div class="box"><h2>🎓 Administrator Classroom</h2><p id="status">Checking administrator access…</p></div></div>
<iframe id="classroom" allow="camera; microphone; display-capture; autoplay; fullscreen"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js?v=20260920-admin3"></script>
<script>
(async()=>{
 try{
  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user) throw Error('Please sign in as administrator first.');
  const {data:p,error}=await supabaseClient.from('profiles').select('role').eq('id',user.id).maybeSingle();
  if(error) throw error;
  if(p?.role!=='admin') throw Error('Administrator access is required.');
  const code=new URLSearchParams(location.search).get('code');
  if(!code) throw Error('No class code was supplied.');
  const frame=document.getElementById('classroom');
  frame.src='../online-class/index.html?code='+encodeURIComponent(code)+'&mode=admin&admin=1&role=admin&v=20260920-admin3#admin';
  frame.style.display='block';
  document.getElementById('guard').style.display='none';
 }catch(e){
  document.getElementById('status').textContent=e.message||'Administrator access could not be verified.';
 }
})();
</script></body></html>
