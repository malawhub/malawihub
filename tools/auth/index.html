<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalawiHub Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>

<style>
/* ... your CSS is perfect, keep it all ... */
</style>
</head>

<body>
<!-- ... your HTML is perfect, keep it all ... -->

<script>
let mode = "signin";

const params = new URLSearchParams(window.location.search);
const redirectTo =
    params.get("redirect") ||
    "/tools/assignment/premium.html";

const signInTab = document.getElementById("signInTab");
const signUpTab = document.getElementById("signUpTab");
const confirmGroup = document.getElementById("confirmGroup");
const confirmPassword = document.getElementById("confirmPassword");
const submitButton = document.getElementById("submitButton");
const forgotPassword = document.getElementById("forgotPassword");
const forgotButton = document.getElementById("forgotButton");
const authForm = document.getElementById("authForm");
const message = document.getElementById("message");

function showMessage(text, type){
    message.textContent = text;
    message.className = "message " + type;
}

function setMode(newMode){
    mode = newMode;
    const isSignUp = mode === "signup";
    signInTab.classList.toggle("active", !isSignUp);
    signUpTab.classList.toggle("active", isSignUp);
    confirmGroup.style.display = isSignUp ? "block" : "none";
    confirmPassword.required = isSignUp;
    submitButton.textContent = isSignUp ? "Create Account" : "Sign In";
    forgotPassword.style.display = isSignUp ? "none" : "block";
    message.className = "message";
    message.textContent = "";
}

signInTab.addEventListener("click", () => setMode("signin"));
signUpTab.addEventListener("click", () => setMode("signup"));

authForm.addEventListener("submit", async function(event){
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    submitButton.disabled = true;

    try{
        if(mode === "signup"){
            if(password !== confirmPassword.value){
                throw new Error("The passwords do not match.");
            }

            // FIX 1: ADD "data," HERE
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options:{
                    emailRedirectTo:
                        window.location.origin +
                        "/tools/assignment/premium.html"
                }
            });

            if(error) throw error;

            // FIX 2: NOW "data" EXISTS SO THIS WON'T CRASH
            console.log("Signup response:", {
                user: data?.user || null,
                session: data?.session || null
            });

            if(!data?.user){
                throw new Error("Supabase did not return a user after signup.");
            }

            // Create/update MalawiHub user profile
            const { error: profileError } = await supabaseClient
                .from("profiles")
                .upsert({
                    id: data.user.id,
                    email: data.user.email,
                    last_seen: new Date().toISOString(),
                    is_online: false
                });

            if(profileError){
                console.error("Profile tracking error:", profileError);
            }

            showMessage("Account created. Please check your email and confirm your account before signing in.","success");
            authForm.reset();

        }else{
            const { data, error } = await supabaseClient.auth.signInWithPassword({email, password});
            if(error) throw error;

            if(data.user){

                // Update MalawiHub profile as online
                const { error: profileError } = await supabaseClient
                    .from("profiles")
                    .upsert({
                        id: data.user.id,
                        email: data.user.email,
                        last_seen: new Date().toISOString(),
                        is_online: true
                    });

                if(profileError){
                    console.error("Online tracking error:", profileError);
                }

                showMessage("Sign in successful. Opening Premium...","success");
                setTimeout(() => { window.location.href = redirectTo; }, 700);
            }
        }
    }catch(error){
        console.error("Authentication error:", error);
        showMessage(error.message || "Unable to complete authentication.","error");
    }finally{
        submitButton.disabled = false;
    }
});

forgotButton.addEventListener("click", async function(){
    const email = document.getElementById("email").value.trim();
    if(!email){
        showMessage("Enter your email address first.","error");
        return;
    }
    try{
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + "/tools/auth/"
        });
        if(error) throw error;
        showMessage("If an account exists for this email, a password reset link has been sent.","success");
    }catch(error){
        showMessage(error.message || "Unable to send the reset email.","error");
    }
});

async function checkExistingSession(){
    const { data } = await supabaseClient.auth.getSession();
    if(data.session){
        showMessage("You are already signed in.","success");
    }
}
checkExistingSession();
</script>
</body>
</html>
