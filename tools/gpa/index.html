<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator - MalawiHub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 16px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.calculator {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.1);
}

h1 {
    text-align: center;
}

.description {
    text-align: center;
    color: #666;
}

.course {
    display: grid;
    grid-template-columns: 1fr 90px 100px 40px;
    gap: 8px;
    margin-bottom: 10px;
}

input,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    border: none;
    background: #111827;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
}

.remove {
    background: #dc2626;
    margin-top: 0;
}

.actions {
    text-align: center;
    margin-top: 15px;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background: #f3f4f6;
    border-radius: 10px;
    text-align: center;
}

#gpa {
    font-size: 40px;
    font-weight: bold;
}

@media(max-width:600px) {
    .course {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🇲🇼 MalawiHub</div>
    <a href="../../index.html">Home</a>
</header>

<div class="container">

<div class="calculator">

<h1>📊 GPA Calculator</h1>

<p class="description">
Calculate your GPA by entering your courses, credits and grades.
</p>

<div id="courses"></div>

<div class="actions">
    <button onclick="addCourse()">+ Add Course</button>
    <button onclick="calculateGPA()">Calculate GPA</button>
</div>

<div class="result">
    <p>Your GPA</p>
    <div id="gpa">0.00</div>
    <p id="details">Enter your course information</p>
</div>

</div>

</div>

<script>

let courseNumber = 0;

function addCourse() {

    courseNumber++;

    const course = document.createElement("div");

    course.className = "course";
    course.id = "course-" + courseNumber;

    course.innerHTML = `
        <input type="text" placeholder="Course name">

        <input
            type="number"
            class="credit"
            placeholder="Credits"
            min="0.5"
            step="0.5">

        <select class="grade">
            <option value="">Grade</option>
            <option value="4">A</option>
            <option value="3">B</option>
            <option value="2">C</option>
            <option value="1">D</option>
            <option value="0">F</option>
        </select>

        <button
            class="remove"
            onclick="removeCourse(${courseNumber})">
            ×
        </button>
    `;

    document.getElementById("courses").appendChild(course);
}

function removeCourse(id) {

    const course = document.getElementById("course-" + id);

    if (course) {
        course.remove();
    }

    calculateGPA();
}

function calculateGPA() {

    const credits = document.querySelectorAll(".credit");
    const grades = document.querySelectorAll(".grade");

    let totalPoints = 0;
    let totalCredits = 0;

    for (let i = 0; i < credits.length; i++) {

        const credit = parseFloat(credits[i].value);
        const grade = parseFloat(grades[i].value);

        if (!isNaN(credit) && !isNaN(grade)) {

            totalPoints += credit * grade;
            totalCredits += credit;
        }
    }

    let gpa = 0;

    if (totalCredits > 0) {
        gpa = totalPoints / totalCredits;
    }

    document.getElementById("gpa").textContent =
        gpa.toFixed(2);

    document.getElementById("details").textContent =
        totalCredits > 0
        ? "Total credits: " + totalCredits
        : "Enter your course information";
}

addCourse();
addCourse();
addCourse();

</script>

</body>
</html>
