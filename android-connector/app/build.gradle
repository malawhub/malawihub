plugins { id 'com.android.application' }

android {
    namespace 'mw.malawihub.connector'
    compileSdk 35

    defaultConfig {
        applicationId 'mw.malawihub.connector'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
            }
            storePassword storePasswordValue
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            // The production keystore is PKCS12. PKCS12 uses the store password
            // for the private key; a separate key-password secret is ignored.
            keyPassword storePasswordValue
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}
